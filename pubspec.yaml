name: jmovies
description: JMovies premium movie and TV streaming application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0
  http: ^1.2.2

  # Images and interface
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.2.1

  # Local storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  sqflite: ^2.3.3+1

  # NATIVE PLAYER DEPENDENCIES
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # BACKGROUND SCRAPER (M3U8 HLS Link nikalne ke liye)
  flutter_inappwebview: ^6.0.0

  # Device and player utilities
  wakelock_plus: ^1.2.8

  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
