name: jmovies
description: JMovies premium movie and TV streaming application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0
  http: ^1.2.2

  # Images and interface
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.2.1

  # Local storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  sqflite: ^2.3.3+1

  # Temporary player dependency
  # This remains until the native Media3 player bridge is added.
  video_player: ^2.9.2

  # Device and player utilities
  wakelock_plus: ^1.2.8
  screen_brightness: ^1.0.1

  # Temporary configuration loader
  # This will be removed after the secure configuration files are installed.
  flutter_dotenv: ^5.1.0

  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
