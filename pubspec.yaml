name: jmovies
description: A premium dark-themed movie discovery & streaming app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking (TMDB API)
  dio: ^5.7.0

  # Images
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  sqflite: ^2.3.3+1

  # UI / Carousels
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.2.1

  # Video playback (HLS / DASH / MP4)
  video_player: ^2.9.2
  wakelock_plus: ^1.2.8
  screen_brightness: ^1.0.1

  # WebView & Streaming
  webview_flutter: ^4.10.0
  flutter_inappwebview: ^6.1.5

  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"
