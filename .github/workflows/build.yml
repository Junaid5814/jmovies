name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          LATEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          unzip -o "$LATEST_ZIP"
          if [ ! -f "pubspec.yaml" ]; then
            DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            cp -r $DIR/* .
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.jmovies.app
          mkdir -p assets/icons assets/images
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml

      - name: Add Native Dependencies
        run: |
          flutter pub add carousel_slider:^5.0.0 webview_flutter wakelock_plus video_player
          flutter pub get

      - name: Setup Tokens & .env File
        run: |
          KEY="dac07662083decf2616c4e68d22342c9"
          TOKEN="eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJkYWMwNzY2MjA4M2RlY2YyNjE2YzRlNjhkMjIzNDJjOSIsIm5iZiI6MTc4OTI5NDQ3My45NDgsInN1YiI6IjZhYTY3Nzg5YjFmNzgyMjZjYjU3ODAyNSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.nXRm_2AAufGAeHFBuMLf4Dg5yViQ-jlTEF2CkYp6WL4"
          cat << EOF > .env
          TMDB_ACCESS_TOKEN=$TOKEN
          TMDB_API_KEY=$KEY
          BASE_URL=https://api.themoviedb.org/3
          IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500
          EOF
          cp .env assets/.env 2>/dev/null || true

      - name: Inject Branding Safely
        run: |
          python3 - << 'EOF'
          import os, re
          branding = """Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            mainAxisSize: MainAxisSize.min,
            children: const [
              Text('Jmovies', style: TextStyle(color: Colors.white, fontSize: 20, fontWeight: FontWeight.bold)),
              Text('POWERED BY JUNAID JAVED', style: TextStyle(color: Colors.redAccent, fontSize: 8.5, fontWeight: FontWeight.bold, letterSpacing: 1.1)),
            ],
          )"""
          for r, _, fs in os.walk('lib'):
            for f in fs:
              if f.endswith('.dart'):
                p = os.path.join(r, f)
                with open(p, 'r', encoding='utf-8', errors='ignore') as fl: t = fl.read()
                m = re.search(r'(const\s+)?Text\s*\(\s*[\'"]J[mM]ovies[\'"]', t)
                if m and 'JUNAID JAVED' not in t:
                  start = m.start()
                  first_paren = t.find('(', start)
                  if first_paren != -1:
                    count, end = 0, -1
                    for i in range(first_paren, len(t)):
                      if t[i] == '(': count += 1
                      elif t[i] == ')':
                        count -= 1
                        if count == 0: end = i + 1; break
                    if end != -1:
                      t = t[:start] + branding + t[end:]
                      with open(p, 'w', encoding='utf-8') as fl: fl.write(t)
          EOF

      - name: Inject Netflix Native Custom Player
        run: |
          python3 - << 'EOF'
          import os, re

          netflix_player = """import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:video_player/video_player.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';

          class __CLASS_NAME__ extends StatefulWidget {
            final dynamic movie, mediaItem, media, item;
            final int? tmdbId, id, seasonNumber, season, episodeNumber, episode;
            final String? title, name;
            final bool isTv;
            final bool? isMovie;

            const __CLASS_NAME__({
              super.key,
              this.movie,
              this.mediaItem,
              this.media,
              this.item,
              this.tmdbId,
              this.id,
              this.title,
              this.name,
              this.isTv = false,
              this.isMovie,
              this.seasonNumber,
              this.season,
              this.episodeNumber,
              this.episode,
            });

            const __CLASS_NAME__.forEpisode({
              super.key,
              required int tmdbId,
              required String title,
              required int seasonNumber,
              required int episodeNumber,
              this.movie,
              this.mediaItem,
              this.media,
              this.item,
              this.id,
              this.name,
              this.isTv = true,
              this.isMovie = false,
              this.season,
              this.episode,
            }) : tmdbId = tmdbId, title = title, seasonNumber = seasonNumber, episodeNumber = episodeNumber;

            @override
            State<__CLASS_NAME__> createState() => ___CLASS_NAME__State();
          }

          class ___CLASS_NAME__State extends State<__CLASS_NAME__> {
            VideoPlayerController? _videoController;
            WebViewController? _snifferController;

            int _currentSourceIndex = 0;
            bool _isExtracting = true;
            bool _showControls = true;
            bool _isBuffering = false;
            double _playbackSpeed = 1.0;
            BoxFit _currentFit = BoxFit.contain;
            Timer? _hideControlsTimer;
            String? _overlayFeedback;
            Timer? _feedbackTimer;

            int get _resolvedId {
              if (widget.tmdbId != null && widget.tmdbId! > 0) return widget.tmdbId!;
              if (widget.id != null && widget.id! > 0) return widget.id!;
              for (var obj in [widget.mediaItem, widget.movie, widget.media, widget.item]) {
                if (obj != null) {
                  try {
                    final val = obj.id;
                    if (val != null && val is int && val > 0) return val;
                  } catch (_) {}
                }
              }
              return 0;
            }

            String get _resolvedTitle {
              if (widget.title != null && widget.title!.isNotEmpty) return widget.title!;
              if (widget.name != null && widget.name!.isNotEmpty) return widget.name!;
              for (var obj in [widget.mediaItem, widget.movie, widget.media, widget.item]) {
                if (obj != null) {
                  try {
                    final t = obj.title ?? obj.name;
                    if (t != null && t.toString().isNotEmpty) return t.toString();
                  } catch (_) {}
                }
              }
              return 'Streaming';
            }

            bool get _resolvedIsTv {
              if (widget.isTv) return true;
              if (widget.seasonNumber != null && widget.seasonNumber! > 0) return true;
              if (widget.season != null && widget.season! > 0) return true;
              for (var obj in [widget.mediaItem, widget.movie, widget.media, widget.item]) {
                if (obj != null) {
                  try {
                    if (obj.mediaType == 'tv') return true;
                  } catch (_) {}
                }
              }
              return false;
            }

            List<Map<String, String>> get _audioStreams {
              final id = _resolvedId;
              final s = widget.seasonNumber ?? widget.season ?? 1;
              final e = widget.episodeNumber ?? widget.episode ?? 1;

              if (_resolvedIsTv) {
                return [
                  {
                    'label': 'Hindi Dubbed / Multi-Audio',
                    'tag': 'Hindi Dub',
                    'embed': 'https://multiembed.mov/?video_id=$id&tmdb=1&s=$s&e=$e&autoplay=1',
                  },
                  {
                    'label': 'Original Audio (English HD)',
                    'tag': 'English HD',
                    'embed': 'https://vidlink.pro/tv/$id/$s/$e?autoplay=true',
                  },
                  {
                    'label': 'Anime & Asian Shows',
                    'tag': 'Anime HD',
                    'embed': 'https://embed.su/embed/tv/$id/$s/$e',
                  },
                  {
                    'label': 'Global Fast Backup',
                    'tag': 'Fast Server',
                    'embed': 'https://vidsrc.cc/v2/embed/tv/$id/$s/$e',
                  },
                ];
              } else {
                return [
                  {
                    'label': 'Hindi Dubbed / Multi-Audio',
                    'tag': 'Hindi Dub',
                    'embed': 'https://multiembed.mov/?video_id=$id&tmdb=1&autoplay=1',
                  },
                  {
                    'label': 'Original Audio (English HD)',
                    'tag': 'English HD',
                    'embed': 'https://vidlink.pro/movie/$id?autoplay=true',
                  },
                  {
                    'label': 'Ultra 4K Server',
                    'tag': 'Ultra HD',
                    'embed': 'https://embed.su/embed/movie/$id',
                  },
                ];
              }
            }

            @override
            void initState() {
              super.initState();
              SystemChrome.setPreferredOrientations([
                DeviceOrientation.landscapeLeft,
                DeviceOrientation.landscapeRight,
              ]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
              WakelockPlus.enable();

              _initStreamExtraction(_currentSourceIndex);
              _startHideControlsTimer();
            }

            void _initStreamExtraction(int index) {
              setState(() {
                _isExtracting = true;
                _isBuffering = true;
              });

              final targetEmbed = _audioStreams[index]['embed']!;
              bool streamFound = false;

              _snifferController = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setUserAgent('Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36')
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onNavigationRequest: (req) {
                      final u = req.url;
                      if (!streamFound && (u.contains('.m3u8') || u.contains('.mp4') || u.contains('/stream/'))) {
                        streamFound = true;
                        _launchNativeStream(u);
                        return NavigationDecision.prevent;
                      }
                      return NavigationDecision.navigate;
                    },
                  ),
                )
                ..loadRequest(Uri.parse(targetEmbed));

              // Fallback timeout if sniffer takes more than 6s
              Timer(const Duration(seconds: 6), () {
                if (!streamFound && mounted && _videoController == null) {
                  _launchNativeStream(targetEmbed, isDirect: false);
                }
              });
            }

            Future<void> _launchNativeStream(String streamUrl, {bool isDirect = true}) async {
              try {
                await _videoController?.dispose();
                final controller = VideoPlayerController.networkUrl(
                  Uri.parse(streamUrl),
                  httpHeaders: const {
                    'User-Agent': 'Mozilla/5.0 (Linux; Android 13; Mobile)',
                    'Referer': 'https://multiembed.mov/',
                  },
                );

                await controller.initialize();
                controller.addListener(() {
                  if (mounted) {
                    setState(() {
                      _isBuffering = controller.value.isBuffering;
                    });
                  }
                });

                await controller.play();

                if (mounted) {
                  setState(() {
                    _videoController = controller;
                    _isExtracting = false;
                    _isBuffering = false;
                  });
                }
              } catch (e) {
                // If stream error, try next server
                if (_currentSourceIndex + 1 < _audioStreams.length) {
                  _switchSource(_currentSourceIndex + 1);
                } else {
                  if (mounted) {
                    setState(() {
                      _isExtracting = false;
                      _isBuffering = false;
                    });
                  }
                }
              }
            }

            void _switchSource(int index) {
              if (index == _currentSourceIndex && _videoController != null) return;
              _currentSourceIndex = index;
              _videoController?.pause();
              _videoController?.dispose();
              _videoController = null;
              _initStreamExtraction(index);
            }

            void _togglePlayPause() {
              if (_videoController == null) return;
              setState(() {
                if (_videoController!.value.isPlaying) {
                  _videoController!.pause();
                  _showFeedback('Paused');
                } else {
                  _videoController!.play();
                  _showFeedback('Playing');
                }
              });
              _startHideControlsTimer();
            }

            void _seekRelative(int seconds) {
              if (_videoController == null) return;
              final current = _videoController!.value.position;
              final target = current + Duration(seconds: seconds);
              _videoController!.seekTo(target);
              _showFeedback(seconds > 0 ? '+$seconds sec' : '$seconds sec');
              _startHideControlsTimer();
            }

            void _showFeedback(String msg) {
              setState(() => _overlayFeedback = msg);
              _feedbackTimer?.cancel();
              _feedbackTimer = Timer(const Duration(milliseconds: 900), () {
                if (mounted) setState(() => _overlayFeedback = null);
              });
            }

            void _startHideControlsTimer() {
              _hideControlsTimer?.cancel();
              _hideControlsTimer = Timer(const Duration(seconds: 4), () {
                if (mounted && (_videoController?.value.isPlaying ?? false)) {
                  setState(() => _showControls = false);
                }
              });
            }

            void _toggleControls() {
              setState(() => _showControls = !_showControls);
              if (_showControls) _startHideControlsTimer();
            }

            String _formatDuration(Duration d) {
              final hours = d.inHours;
              final minutes = d.inMinutes.remainder(60);
              final seconds = d.inSeconds.remainder(60);
              if (hours > 0) {
                return '$hours:${minutes.toString().padLeft(2, '0')}:${seconds.toString().padLeft(2, '0')}';
              }
              return '${minutes.toString().padLeft(2, '0')}:${seconds.toString().padLeft(2, '0')}';
            }

            void _showAudioLanguagePicker() {
              _hideControlsTimer?.cancel();
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF141414),
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(20)),
                ),
                builder: (ctx) {
                  return SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.symmetric(vertical: 16, horizontal: 18),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              const Text('Audio & Dub Options', style: TextStyle(color: Colors.white, fontSize: 17, fontWeight: FontWeight.bold)),
                              IconButton(icon: const Icon(Icons.close, color: Colors.white54, size: 20), onPressed: () => Navigator.pop(ctx)),
                            ],
                          ),
                          const SizedBox(height: 8),
                          ...List.generate(_audioStreams.length, (idx) {
                            final isSel = idx == _currentSourceIndex;
                            final s = _audioStreams[idx];
                            return Container(
                              margin: const EdgeInsets.symmetric(vertical: 5),
                              decoration: BoxDecoration(
                                color: isSel ? Colors.redAccent.withOpacity(0.18) : Colors.white.withOpacity(0.04),
                                borderRadius: BorderRadius.circular(12),
                                border: Border.all(color: isSel ? Colors.redAccent : Colors.transparent),
                              ),
                              child: ListTile(
                                dense: true,
                                leading: Icon(
                                  idx == 0 ? Icons.translate_rounded : Icons.audiotrack_rounded,
                                  color: isSel ? Colors.redAccent : Colors.white70,
                                ),
                                title: Text(s['label']!, style: TextStyle(color: isSel ? Colors.redAccent : Colors.white, fontWeight: isSel ? FontWeight.bold : FontWeight.normal)),
                                subtitle: Text(s['tag']!, style: TextStyle(color: isSel ? Colors.redAccent.withOpacity(0.8) : Colors.white38, fontSize: 11)),
                                trailing: isSel ? const Icon(Icons.check_circle, color: Colors.redAccent) : null,
                                onTap: () {
                                  Navigator.pop(ctx);
                                  _switchSource(idx);
                                },
                              ),
                            );
                          }),
                          const SizedBox(height: 12),
                        ],
                      ),
                    ),
                  );
                },
              ).then((_) => _startHideControlsTimer());
            }

            @override
            void dispose() {
              _hideControlsTimer?.cancel();
              _feedbackTimer?.cancel();
              _videoController?.dispose();
              SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
              WakelockPlus.disable();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final activeSource = _audioStreams[_currentSourceIndex];
              final hasValidPlayer = _videoController != null && _videoController!.value.isInitialized;

              return Scaffold(
                backgroundColor: Colors.black,
                body: SafeArea(
                  child: Stack(
                    fit: StackFit.expand,
                    children: [
                      // Native Video Surface
                      if (hasValidPlayer)
                        Center(
                          child: FittedBox(
                            fit: _currentFit,
                            child: SizedBox(
                              width: _videoController!.value.size.width,
                              height: _videoController!.value.size.height,
                              child: VideoPlayer(_videoController!),
                            ),
                          ),
                        )
                      else
                        // Background sniffer webview running silently off-screen
                        if (_snifferController != null)
                          Opacity(
                            opacity: 0.01,
                            child: WebViewWidget(controller: _snifferController!),
                          ),

                      // Gesture Detector for Controls & Seek
                      GestureDetector(
                        behavior: HitTestBehavior.translucent,
                        onTap: _toggleControls,
                        onDoubleTapDown: (details) {
                          final screenWidth = MediaQuery.of(context).size.width;
                          if (details.globalPosition.dx < screenWidth / 2) {
                            _seekRelative(-10);
                          } else {
                            _seekRelative(10);
                          }
                        },
                      ),

                      // Netflix Buffering / Loading State
                      if (_isExtracting || _isBuffering)
                        Container(
                          color: _isExtracting ? Colors.black : Colors.black26,
                          child: Center(
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const CircularProgressIndicator(color: Colors.redAccent, strokeWidth: 3),
                                const SizedBox(height: 16),
                                Text(
                                  _isExtracting ? 'Opening ${activeSource['tag']}...' : 'Buffering HD stream...',
                                  style: const TextStyle(color: Colors.white70, fontSize: 13, letterSpacing: 0.5),
                                ),
                              ],
                            ),
                          ),
                        ),

                      // Center Feedback Pill (e.g. +10s, Paused)
                      if (_overlayFeedback != null)
                        Center(
                          child: Container(
                            padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 10),
                            decoration: BoxDecoration(
                              color: Colors.black87,
                              borderRadius: BorderRadius.circular(25),
                              border: Border.all(color: Colors.redAccent, width: 1),
                            ),
                            child: Text(
                              _overlayFeedback!,
                              style: const TextStyle(color: Colors.white, fontSize: 15, fontWeight: FontWeight.bold),
                            ),
                          ),
                        ),

                      // Netflix Native Controls Overlay
                      AnimatedOpacity(
                        duration: const Duration(milliseconds: 250),
                        opacity: _showControls ? 1.0 : 0.0,
                        child: IgnorePointer(
                          ignoring: !_showControls,
                          child: Container(
                            decoration: BoxDecoration(
                              gradient: LinearGradient(
                                colors: [
                                  Colors.black.withOpacity(0.85),
                                  Colors.transparent,
                                  Colors.black.withOpacity(0.85),
                                ],
                                begin: Alignment.topCenter,
                                end: Alignment.bottomCenter,
                                stops: const [0.0, 0.5, 1.0],
                              ),
                            ),
                            child: Column(
                              children: [
                                // Top Header Bar
                                Padding(
                                  padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                                  child: Row(
                                    children: [
                                      IconButton(
                                        icon: const Icon(Icons.arrow_back_ios_new, color: Colors.white, size: 20),
                                        onPressed: () => Navigator.pop(context),
                                      ),
                                      const SizedBox(width: 8),
                                      Expanded(
                                        child: Text(
                                          _resolvedTitle,
                                          maxLines: 1,
                                          overflow: TextOverflow.ellipsis,
                                          style: const TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold),
                                        ),
                                      ),
                                      InkWell(
                                        borderRadius: BorderRadius.circular(20),
                                        onTap: _showAudioLanguagePicker,
                                        child: Container(
                                          padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                                          decoration: BoxDecoration(
                                            color: Colors.redAccent.withOpacity(0.25),
                                            borderRadius: BorderRadius.circular(20),
                                            border: Border.all(color: Colors.redAccent),
                                          ),
                                          child: Row(
                                            mainAxisSize: MainAxisSize.min,
                                            children: [
                                              const Icon(Icons.translate_rounded, color: Colors.redAccent, size: 15),
                                              const SizedBox(width: 6),
                                              Text(
                                                activeSource['tag']!,
                                                style: const TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.bold),
                                              ),
                                              const SizedBox(width: 4),
                                              const Icon(Icons.keyboard_arrow_down, color: Colors.white70, size: 16),
                                            ],
                                          ),
                                        ),
                                      ),
                                    ],
                                  ),
                                ),

                                // Center Play / Pause / Skip Controls
                                Expanded(
                                  child: Row(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: [
                                      IconButton(
                                        iconSize: 42,
                                        icon: const Icon(Icons.replay_10_rounded, color: Colors.white),
                                        onPressed: () => _seekRelative(-10),
                                      ),
                                      const SizedBox(width: 36),
                                      IconButton(
                                        iconSize: 64,
                                        icon: Icon(
                                          (_videoController?.value.isPlaying ?? false)
                                              ? Icons.pause_circle_filled_rounded
                                              : Icons.play_circle_filled_rounded,
                                          color: Colors.redAccent,
                                        ),
                                        onPressed: _togglePlayPause,
                                      ),
                                      const SizedBox(width: 36),
                                      IconButton(
                                        iconSize: 42,
                                        icon: const Icon(Icons.forward_10_rounded, color: Colors.white),
                                        onPressed: () => _seekRelative(10),
                                      ),
                                    ],
                                  ),
                                ),

                                // Bottom Scrubber Bar
                                Padding(
                                  padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 12),
                                  child: Column(
                                    mainAxisSize: MainAxisSize.min,
                                    children: [
                                      if (hasValidPlayer)
                                        SliderTheme(
                                          data: SliderTheme.of(context).copyWith(
                                            trackHeight: 3.5,
                                            thumbShape: const RoundSliderThumbShape(enabledThumbRadius: 6),
                                            activeTrackColor: Colors.redAccent,
                                            inactiveTrackColor: Colors.white24,
                                            thumbColor: Colors.redAccent,
                                            overlayColor: Colors.redAccent.withOpacity(0.2),
                                          ),
                                          child: Slider(
                                            value: _videoController!.value.position.inMilliseconds.toDouble().clamp(
                                                  0.0,
                                                  _videoController!.value.duration.inMilliseconds.toDouble(),
                                                ),
                                            min: 0.0,
                                            max: _videoController!.value.duration.inMilliseconds.toDouble(),
                                            onChanged: (val) {
                                              _videoController!.seekTo(Duration(milliseconds: val.toInt()));
                                              _startHideControlsTimer();
                                            },
                                          ),
                                        ),
                                      Row(
                                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                        children: [
                                          Text(
                                            hasValidPlayer
                                                ? _formatDuration(_videoController!.value.position)
                                                : '00:00',
                                            style: const TextStyle(color: Colors.white70, fontSize: 12),
                                          ),
                                          Row(
                                            children: [
                                              TextButton(
                                                onPressed: () {
                                                  setState(() {
                                                    _playbackSpeed = _playbackSpeed == 1.0 ? 1.25 : (_playbackSpeed == 1.25 ? 1.5 : 1.0);
                                                    _videoController?.setPlaybackSpeed(_playbackSpeed);
                                                  });
                                                  _showFeedback('${_playbackSpeed}x Speed');
                                                },
                                                child: Text('${_playbackSpeed}x', style: const TextStyle(color: Colors.white70, fontSize: 13, fontWeight: FontWeight.bold)),
                                              ),
                                              IconButton(
                                                icon: Icon(
                                                  _currentFit == BoxFit.contain ? Icons.fullscreen_rounded : Icons.fullscreen_exit_rounded,
                                                  color: Colors.white70,
                                                ),
                                                onPressed: () {
                                                  setState(() {
                                                    _currentFit = _currentFit == BoxFit.contain ? BoxFit.cover : BoxFit.contain;
                                                  });
                                                  _showFeedback(_currentFit == BoxFit.cover ? 'Zoom to Fill' : 'Fit to Screen');
                                                },
                                              ),
                                            ],
                                          ),
                                          Text(
                                            hasValidPlayer
                                                ? _formatDuration(_videoController!.value.duration)
                                                : '00:00',
                                            style: const TextStyle(color: Colors.white70, fontSize: 12),
                                          ),
                                        ],
                                      ),
                                    ],
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          """

          for root, _, files in os.walk('lib'):
              for f in files:
                  if f.endswith('.dart'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fl:
                          c = fl.read()
                      if ('Could not load the player' in c) or ('_currentServer' in c) or ('PlayerScreen' in c) or ('WatchScreen' in c):
                          m = re.search(r'class\s+([A-Za-z0-9_]+)\s+extends\s+StatefulWidget', c)
                          class_name = m.group(1) if m else 'PlayerScreen'
                          code = netflix_player.replace('__CLASS_NAME__', class_name)
                          with open(p, 'w', encoding='utf-8') as fl:
                              fl.write(code)

          for loc in ['lib/screens/player/player_screen.dart', 'lib/screens/player_screen.dart']:
              os.makedirs(os.path.dirname(loc), exist_ok=True)
              code = netflix_player.replace('__CLASS_NAME__', 'PlayerScreen')
              with open(loc, 'w', encoding='utf-8') as fl:
                  fl.write(code)
          EOF

      - name: Patch Android SDK 35 & Proguard
        run: |
          python3 - << 'EOF'
          import os, re

          for root, _, files in os.walk('android'):
              for f in files:
                  if f.startswith('build.gradle'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fl:
                          c = fl.read()
                      c = re.sub(r'compileSdk(Version)?\s*=?\s*(flutter\.)?compileSdkVersion', 'compileSdk = 35', c)
                      c = re.sub(r'compileSdkVersion\s+[0-9]+', 'compileSdkVersion 35', c)
                      c = re.sub(r'compileSdk\s*=\s*[0-9]+', 'compileSdk = 35', c)
                      c = c.replace('proguard-android.txt', 'proguard-android-optimize.txt')
                      with open(p, 'w', encoding='utf-8') as fl:
                          fl.write(c)

          cache_dir = os.path.expanduser('~/.pub-cache')
          for root, _, files in os.walk(cache_dir):
              for f in files:
                  if f.endswith('.gradle'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fl:
                          c = fl.read()
                      c = re.sub(r'compileSdkVersion\s+[0-9]+', 'compileSdkVersion 35', c)
                      c = re.sub(r'compileSdk\s*=\s*[0-9]+', 'compileSdk = 35', c)
                      c = c.replace('proguard-android.txt', 'proguard-android-optimize.txt')
                      with open(p, 'w', encoding='utf-8') as fl:
                          fl.write(c)

          for root, _, files in os.walk(cache_dir):
              for f in files:
                  if f.endswith('.java'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fl:
                          c = fl.read()
                      if 'BAKLAVA' in c or 'Locale.of' in c or 'thread.threadId()' in c:
                          c = c.replace('Build.VERSION_CODES.BAKLAVA', '999')
                          c = c.replace('Locale.of(language, country, variant)', 'new Locale(language, country, variant)')
                          c = c.replace('thread.threadId()', 'thread.getId()')
                          with open(p, 'w', encoding='utf-8') as fl:
                              fl.write(c)
          EOF

          cat << 'EOF' >> android/build.gradle

          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          try { compileSdkVersion 35 } catch (e) {}
                          try { compileSdk = 35 } catch (e) {}
                      }
                  }
              }
          }
          EOF

      - name: Build and Sign Valid APK
        run: |
          flutter build apk --release || true

          APK_FILE=$(find android build -name "*.apk" 2>/dev/null | grep -E "release|app" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            cd android && ./gradlew assembleRelease && cd ..
            APK_FILE=$(find android build -name "*.apk" 2>/dev/null | grep -E "release|app" | head -n 1)
          fi

          mkdir -p build/app/outputs/flutter-apk
          TARGET_APK="build/app/outputs/flutter-apk/app-release.apk"

          BT_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)

          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          $BT_DIR/zipalign -f -p 4 "$APK_FILE" aligned.apk
          $BT_DIR/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out "$TARGET_APK" aligned.apk
          $BT_DIR/apksigner verify --verbose "$TARGET_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jmovies-apk
          path: build/app/outputs/flutter-apk/*.apk
