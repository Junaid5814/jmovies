name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          LATEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          unzip -o "$LATEST_ZIP"
          if [ ! -f "pubspec.yaml" ]; then
            DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            cp -r $DIR/* .
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.jmovies.app
          mkdir -p assets/icons assets/images
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml

      - name: Add Dependencies
        run: |
          flutter pub add carousel_slider:^5.0.0 webview_flutter wakelock_plus
          flutter pub get

      - name: Setup Tokens & .env File
        run: |
          KEY="dac07662083decf2616c4e68d22342c9"
          TOKEN="eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJkYWMwNzY2MjA4M2RlY2YyNjE2YzRlNjhkMjIzNDJjOSIsIm5iZiI6MTc4OTI5NDQ3My45NDgsInN1YiI6IjZhYTY3Nzg5YjFmNzgyMjZjYjU3ODAyNSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.nXRm_2AAufGAeHFBuMLf4Dg5yViQ-jlTEF2CkYp6WL4"
          cat << EOF > .env
          TMDB_ACCESS_TOKEN=$TOKEN
          TMDB_API_KEY=$KEY
          BASE_URL=https://api.themoviedb.org/3
          IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500
          EOF
          cp .env assets/.env 2>/dev/null || true

      - name: Inject Branding (Powered by Junaid Javed)
        run: |
          python3 - << 'EOF'
          import os, re
          for r, _, fs in os.walk('lib'):
            for f in fs:
              if f.endswith('.dart'):
                p = os.path.join(r, f)
                with open(p, 'r') as fl: t = fl.read()
                t = re.sub(r'const\s+Text\(\s*[\'\"]J[mM]ovies[\'\"][^)]*\)', "Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisSize: MainAxisSize.min, children: const [Text('Jmovies', style: TextStyle(color: Colors.white, fontSize: 20, fontWeight: FontWeight.bold)), Text('POWERED BY JUNAID JAVED', style: TextStyle(color: Colors.redAccent, fontSize: 8.5, fontWeight: FontWeight.bold))])", t)
                t = re.sub(r'Text\(\s*[\'\"]J[mM]ovies[\'\"][^)]*\)', "Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisSize: MainAxisSize.min, children: const [Text('Jmovies', style: TextStyle(color: Colors.white, fontSize: 20, fontWeight: FontWeight.bold)), Text('POWERED BY JUNAID JAVED', style: TextStyle(color: Colors.redAccent, fontSize: 8.5, fontWeight: FontWeight.bold))])", t)
                with open(p, 'w') as fl: fl.write(t)
          EOF

      - name: Inject Working Universal Player
        run: |
          cat << 'EOF' > lib/screens/player/player_screen.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';

          class PlayerScreen extends StatefulWidget {
            final dynamic movie;
            final dynamic mediaItem;
            final int? tmdbId;
            final String? title;
            final bool isTv;
            final int? seasonNumber;
            final int? episodeNumber;

            const PlayerScreen({super.key, this.movie, this.mediaItem, this.tmdbId, this.title, this.isTv = false, this.seasonNumber, this.episodeNumber});
            const PlayerScreen.forEpisode({super.key, required int tmdbId, required String title, required int seasonNumber, required int episodeNumber, this.movie, this.mediaItem})
                : tmdbId = tmdbId, title = title, isTv = true, seasonNumber = seasonNumber, episodeNumber = episodeNumber;

            @override
            State<PlayerScreen> createState() => _PlayerScreenState();
          }

          class _PlayerScreenState extends State<PlayerScreen> {
            late final WebViewController _c;
            int _srv = 0;
            int get _id => widget.tmdbId ?? widget.mediaItem?.id ?? widget.movie?.id ?? 0;
            bool get _isTv => widget.isTv || (widget.seasonNumber != null && widget.seasonNumber! > 0) || (widget.mediaItem?.mediaType == 'tv');
            
            List<String> get _urls {
              final id = _id;
              final s = widget.seasonNumber ?? 1;
              final e = widget.episodeNumber ?? 1;
              return _isTv
                  ? ['https://vidsrc.cc/v2/embed/tv/$id/$s/$e', 'https://multiembed.mov/?video_id=$id&tmdb=1&s=$s&e=$e', 'https://vidlink.pro/tv/$id/$s/$e']
                  : ['https://vidsrc.cc/v2/embed/movie/$id', 'https://multiembed.mov/?video_id=$id&tmdb=1', 'https://vidlink.pro/movie/$id'];
            }

            @override
            void initState() {
              super.initState();
              SystemChrome.setPreferredOrientations([DeviceOrientation.landscapeLeft, DeviceOrientation.landscapeRight]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
              WakelockPlus.enable();
              _c = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setUserAgent('Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36')
                ..setBackgroundColor(Colors.black)
                ..loadRequest(Uri.parse(_urls[_srv]));
            }

            @override
            void dispose() {
              SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
              WakelockPlus.disable();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _c),
                      Positioned(
                        top: 10, left: 10,
                        child: CircleAvatar(
                          backgroundColor: Colors.black54,
                          child: IconButton(icon: const Icon(Icons.arrow_back, color: Colors.white), onPressed: () => Navigator.pop(context)),
                        ),
                      ),
                      Positioned(
                        top: 10, right: 10,
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.redAccent),
                          onPressed: () {
                            setState(() => _srv = (_srv + 1) % _urls.length);
                            _c.loadRequest(Uri.parse(_urls[_srv]));
                          },
                          child: Text('Server ${_srv + 1} (Switch)', style: const TextStyle(color: Colors.white, fontSize: 12)),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Patch Proguard
        run: |
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i "s/proguard-android\.txt/proguard-android-optimize\.txt/g" {} + 2>/dev/null || true
          find . -name "build.gradle" -exec sed -i "s/proguard-android\.txt/proguard-android-optimize\.txt/g" {} + 2>/dev/null || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jmovies-apk
          path: build/app/outputs/flutter-apk/*.apk
