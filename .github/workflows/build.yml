name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          LATEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          unzip -o "$LATEST_ZIP"
          if [ ! -f "pubspec.yaml" ]; then
            DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            cp -r $DIR/* .
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.jmovies.app
          mkdir -p assets/icons assets/images
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml

      - name: Add Native Player Dependencies
        run: |
          flutter pub add carousel_slider:^5.0.0 webview_flutter wakelock_plus video_player chewie
          flutter pub get

      - name: Setup Tokens & .env File
        run: |
          KEY="dac07662083decf2616c4e68d22342c9"
          TOKEN="eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJkYWMwNzY2MjA4M2RlY2YyNjE2YzRlNjhkMjIzNDJjOSIsIm5iZiI6MTc4OTI5NDQ3My45NDgsInN1YiI6IjZhYTY3Nzg5YjFmNzgyMjZjYjU3ODAyNSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.nXRm_2AAufGAeHFBuMLf4Dg5yViQ-jlTEF2CkYp6WL4"
          cat << EOF > .env
          TMDB_ACCESS_TOKEN=$TOKEN
          TMDB_API_KEY=$KEY
          BASE_URL=https://api.themoviedb.org/3
          IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500
          EOF
          cp .env assets/.env 2>/dev/null || true

      - name: Inject Branding Safely
        run: |
          python3 - << 'EOF'
          import os, re
          branding = """Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            mainAxisSize: MainAxisSize.min,
            children: const [
              Text('Jmovies', style: TextStyle(color: Colors.white, fontSize: 20, fontWeight: FontWeight.bold)),
              Text('POWERED BY JUNAID JAVED', style: TextStyle(color: Colors.redAccent, fontSize: 8.5, fontWeight: FontWeight.bold, letterSpacing: 1.1)),
            ],
          )"""
          for r, _, fs in os.walk('lib'):
            for f in fs:
              if f.endswith('.dart'):
                p = os.path.join(r, f)
                with open(p, 'r', encoding='utf-8', errors='ignore') as fl: t = fl.read()
                m = re.search(r'(const\s+)?Text\s*\(\s*[\'"]J[mM]ovies[\'"]', t)
                if m and 'JUNAID JAVED' not in t:
                  start = m.start()
                  first_paren = t.find('(', start)
                  if first_paren != -1:
                    count, end = 0, -1
                    for i in range(first_paren, len(t)):
                      if t[i] == '(': count += 1
                      elif t[i] == ')':
                        count -= 1
                        if count == 0: end = i + 1; break
                    if end != -1:
                      t = t[:start] + branding + t[end:]
                      with open(p, 'w', encoding='utf-8') as fl: fl.write(t)
          EOF

      - name: Inject Native Chewie Player Engine
        run: |
          cat << 'EOF' > lib/screens/player_screen.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:video_player/video_player.dart';
          import 'package:chewie/chewie.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';

          class PlayerScreen extends StatefulWidget {
            final dynamic movie;
            final dynamic mediaItem;
            final dynamic media;
            final dynamic item;
            final int? tmdbId;
            final int? id;
            final String? title;
            final String? name;
            final bool isTv;
            final bool? isMovie;
            final int? seasonNumber;
            final int? season;
            final int? episodeNumber;
            final int? episode;

            const PlayerScreen({
              super.key,
              this.movie,
              this.mediaItem,
              this.media,
              this.item,
              this.tmdbId,
              this.id,
              this.title,
              this.name,
              this.isTv = false,
              this.isMovie,
              this.seasonNumber,
              this.season,
              this.episodeNumber,
              this.episode,
            });

            const PlayerScreen.forEpisode({
              super.key,
              required int tmdbId,
              required String title,
              required int seasonNumber,
              required int episodeNumber,
              this.movie,
              this.mediaItem,
              this.media,
              this.item,
              this.id,
              this.name,
              this.isTv = true,
              this.isMovie = false,
              this.season,
              this.episode,
            }) : tmdbId = tmdbId, title = title, seasonNumber = seasonNumber, episodeNumber = episodeNumber;

            @override
            State<PlayerScreen> createState() => _PlayerScreenState();
          }

          class _PlayerScreenState extends State<PlayerScreen> {
            VideoPlayerController? _videoPlayerController;
            ChewieController? _chewieController;
            WebViewController? _extractorController;

            bool _isExtracting = true;
            bool _nativeReady = false;
            String? _streamUrl;
            int _serverIndex = 0;

            int get _resolvedId {
              if (widget.tmdbId != null && widget.tmdbId! > 0) return widget.tmdbId!;
              if (widget.id != null && widget.id! > 0) return widget.id!;
              for (var obj in [widget.mediaItem, widget.movie, widget.media, widget.item]) {
                if (obj != null) {
                  try {
                    final val = obj.id;
                    if (val != null && val is int && val > 0) return val;
                  } catch (_) {}
                }
              }
              return 0;
            }

            String get _resolvedTitle {
              if (widget.title != null && widget.title!.isNotEmpty) return widget.title!;
              if (widget.name != null && widget.name!.isNotEmpty) return widget.name!;
              for (var obj in [widget.mediaItem, widget.movie, widget.media, widget.item]) {
                if (obj != null) {
                  try {
                    final t = obj.title ?? obj.name;
                    if (t != null && t.toString().isNotEmpty) return t.toString();
                  } catch (_) {}
                }
              }
              return 'Playing';
            }

            bool get _resolvedIsTv {
              if (widget.isTv) return true;
              if (widget.seasonNumber != null && widget.seasonNumber! > 0) return true;
              if (widget.season != null && widget.season! > 0) return true;
              for (var obj in [widget.mediaItem, widget.movie, widget.media, widget.item]) {
                if (obj != null) {
                  try {
                    if (obj.mediaType == 'tv') return true;
                  } catch (_) {}
                }
              }
              return false;
            }

            List<String> get _embedUrls {
              final id = _resolvedId;
              final s = widget.seasonNumber ?? widget.season ?? 1;
              final e = widget.episodeNumber ?? widget.episode ?? 1;

              if (_resolvedIsTv) {
                return [
                  'https://vidsrc.cc/v2/embed/tv/$id/$s/$e',
                  'https://multiembed.mov/?video_id=$id&tmdb=1&s=$s&e=$e',
                  'https://vidlink.pro/tv/$id/$s/$e',
                ];
              } else {
                return [
                  'https://vidsrc.cc/v2/embed/movie/$id',
                  'https://multiembed.mov/?video_id=$id&tmdb=1',
                  'https://vidlink.pro/movie/$id',
                ];
              }
            }

            @override
            void initState() {
              super.initState();
              SystemChrome.setPreferredOrientations([
                DeviceOrientation.landscapeLeft,
                DeviceOrientation.landscapeRight,
              ]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
              WakelockPlus.enable();

              _startStreamExtraction();
            }

            void _startStreamExtraction() {
              setState(() {
                _isExtracting = true;
                _nativeReady = false;
              });

              final targetUrl = _embedUrls[_serverIndex];

              _extractorController = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36')
                ..setBackgroundColor(Colors.black)
                ..addJavaScriptChannel(
                  'NativeSniffer',
                  onMessageReceived: (JavaScriptMessage msg) {
                    final raw = msg.message;
                    if (raw.isNotEmpty && (raw.contains('.m3u8') || raw.contains('.mp4'))) {
                      _initNativeChewie(raw);
                    }
                  },
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onNavigationRequest: (req) {
                      final u = req.url.toLowerCase();
                      if (u.contains('.m3u8') || u.contains('.mp4')) {
                        _initNativeChewie(req.url);
                      }
                      if (u.contains('vidsrc') || u.contains('multiembed') || u.contains('vidlink') || u.contains('embed')) {
                        return NavigationDecision.navigate;
                      }
                      return NavigationDecision.prevent;
                    },
                    onPageFinished: (_) {
                      _injectAutoSnifferScript();
                    },
                  ),
                )
                ..loadRequest(Uri.parse(targetUrl));

              Timer(const Duration(seconds: 7), () {
                if (mounted && _isExtracting && !_nativeReady) {
                  setState(() => _isExtracting = false);
                }
              });
            }

            void _injectAutoSnifferScript() {
              const js = """
                (function() {
                  const origOpen = XMLHttpRequest.prototype.open;
                  XMLHttpRequest.prototype.open = function(method, url) {
                    if (url && (url.includes('.m3u8') || url.includes('.mp4'))) {
                      NativeSniffer.postMessage(url);
                    }
                    return origOpen.apply(this, arguments);
                  };

                  const origFetch = window.fetch;
                  window.fetch = function(url, init) {
                    if (typeof url === 'string' && (url.includes('.m3u8') || url.includes('.mp4'))) {
                      NativeSniffer.postMessage(url);
                    }
                    return origFetch.apply(this, arguments);
                  };

                  setInterval(function() {
                    const v = document.querySelector('video');
                    if (v) {
                      if (v.src && (v.src.includes('.m3u8') || v.src.includes('.mp4'))) {
                        NativeSniffer.postMessage(v.src);
                      }
                      if (v.paused) {
                        v.play().catch(function(){});
                      }
                    }
                    const btn = document.querySelector('.play-btn, .vjs-big-play-button, button[aria-label="Play"], #play');
                    if (btn) btn.click();
                  }, 400);
                })();
              """;
              _extractorController?.runJavaScript(js).catchError((_) {});
            }

            Future<void> _initNativeChewie(String url) async {
              if (_nativeReady) return;

              _streamUrl = url;
              try {
                _videoPlayerController = VideoPlayerController.networkUrl(
                  Uri.parse(url),
                  httpHeaders: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                    'Referer': _embedUrls[_serverIndex],
                  },
                );

                await _videoPlayerController!.initialize();

                _chewieController = ChewieController(
                  videoPlayerController: _videoPlayerController!,
                  autoPlay: true,
                  looping: false,
                  allowFullScreen: true,
                  fullScreenByDefault: true,
                  showControls: true,
                  materialProgressColors: ChewieProgressColors(
                    playedColor: Colors.redAccent,
                    handleColor: Colors.redAccent,
                    bufferedColor: Colors.white24,
                    backgroundColor: Colors.white12,
                  ),
                  errorBuilder: (context, errorMessage) {
                    return Center(
                      child: Text(
                        errorMessage,
                        style: const TextStyle(color: Colors.white),
                      ),
                    );
                  },
                );

                if (mounted) {
                  setState(() {
                    _isExtracting = false;
                    _nativeReady = true;
                  });
                }
              } catch (_) {
                if (mounted) {
                  setState(() => _isExtracting = false);
                }
              }
            }

            @override
            void dispose() {
              _videoPlayerController?.dispose();
              _chewieController?.dispose();
              SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
              WakelockPlus.disable();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: SafeArea(
                  child: Stack(
                    children: [
                      if (_nativeReady && _chewieController != null)
                        Chewie(controller: _chewieController!)
                      else if (_extractorController != null)
                        WebViewWidget(controller: _extractorController!),

                      if (_isExtracting)
                        Container(
                          color: Colors.black,
                          child: Center(
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const CircularProgressIndicator(color: Colors.redAccent),
                                const SizedBox(height: 20),
                                Text(
                                  'Loading "${_resolvedTitle}"...',
                                  style: const TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold),
                                ),
                                const SizedBox(height: 6),
                                const Text(
                                  'Preparing High-Speed Native Stream',
                                  style: TextStyle(color: Colors.white54, fontSize: 12),
                                ),
                              ],
                            ),
                          ),
                        ),

                      Positioned(
                        top: 12,
                        left: 12,
                        child: CircleAvatar(
                          backgroundColor: Colors.black54,
                          child: IconButton(
                            icon: const Icon(Icons.arrow_back, color: Colors.white),
                            onPressed: () => Navigator.pop(context),
                          ),
                        ),
                      ),

                      Positioned(
                        top: 12,
                        right: 12,
                        child: InkWell(
                          borderRadius: BorderRadius.circular(20),
                          onTap: () {
                            setState(() {
                              _serverIndex = (_serverIndex + 1) % _embedUrls.length;
                            });
                            _startStreamExtraction();
                          },
                          child: Container(
                            padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                            decoration: BoxDecoration(
                              color: Colors.black.withOpacity(0.65),
                              borderRadius: BorderRadius.circular(20),
                              border: Border.all(color: Colors.white24, width: 0.8),
                            ),
                            child: Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const Icon(Icons.dns_rounded, color: Colors.redAccent, size: 14),
                                const SizedBox(width: 6),
                                Text(
                                  'Server ${_serverIndex + 1}',
                                  style: const TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.bold),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          mkdir -p lib/screens/player
          cp lib/screens/player_screen.dart lib/screens/player/player_screen.dart

      - name: Patch Plugins (SDK 34 & Proguard)
        run: |
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i -E 's/compileSdkVersion[ =]+[0-9]+/compileSdkVersion 34/g' {} + 2>/dev/null || true
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i -E 's/compileSdk[ =]+[0-9]+/compileSdk 34/g' {} + 2>/dev/null || true
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i "s/proguard-android\.txt/proguard-android-optimize\.txt/g" {} + 2>/dev/null || true
          find . -name "build.gradle" -exec sed -i "s/proguard-android\.txt/proguard-android-optimize\.txt/g" {} + 2>/dev/null || true

          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jmovies-apk
          path: build/app/outputs/flutter-apk/*.apk
