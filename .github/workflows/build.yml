name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          LATEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          unzip -o "$LATEST_ZIP"
          if [ ! -f "pubspec.yaml" ]; then
            DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            cp -r $DIR/* .
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.jmovies.app
          mkdir -p assets/icons assets/images
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml

      - name: Add Dependencies
        run: |
          flutter pub add carousel_slider:^5.0.0 webview_flutter wakelock_plus
          flutter pub get

      - name: Setup Tokens & .env File
        run: |
          KEY="dac07662083decf2616c4e68d22342c9"
          TOKEN="eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJkYWMwNzY2MjA4M2RlY2YyNjE2YzRlNjhkMjIzNDJjOSIsIm5iZiI6MTc4OTI5NDQ3My45NDgsInN1YiI6IjZhYTY3Nzg5YjFmNzgyMjZjYjU3ODAyNSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.nXRm_2AAufGAeHFBuMLf4Dg5yViQ-jlTEF2CkYp6WL4"
          cat << EOF > .env
          TMDB_ACCESS_TOKEN=$TOKEN
          TMDB_API_KEY=$KEY
          BASE_URL=https://api.themoviedb.org/3
          IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500
          EOF
          cp .env assets/.env 2>/dev/null || true

      - name: Inject Branding Safely
        run: |
          python3 - << 'EOF'
          import os, re
          branding = """Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            mainAxisSize: MainAxisSize.min,
            children: const [
              Text('Jmovies', style: TextStyle(color: Colors.white, fontSize: 20, fontWeight: FontWeight.bold)),
              Text('POWERED BY JUNAID JAVED', style: TextStyle(color: Colors.redAccent, fontSize: 8.5, fontWeight: FontWeight.bold, letterSpacing: 1.1)),
            ],
          )"""
          for r, _, fs in os.walk('lib'):
            for f in fs:
              if f.endswith('.dart'):
                p = os.path.join(r, f)
                with open(p, 'r', encoding='utf-8', errors='ignore') as fl: t = fl.read()
                m = re.search(r'(const\s+)?Text\s*\(\s*[\'"]J[mM]ovies[\'"]', t)
                if m and 'JUNAID JAVED' not in t:
                  start = m.start()
                  first_paren = t.find('(', start)
                  if first_paren != -1:
                    count, end = 0, -1
                    for i in range(first_paren, len(t)):
                      if t[i] == '(': count += 1
                      elif t[i] == ')':
                        count -= 1
                        if count == 0: end = i + 1; break
                    if end != -1:
                      t = t[:start] + branding + t[end:]
                      with open(p, 'w', encoding='utf-8') as fl: fl.write(t)
          EOF

      - name: Inject Upgraded Gesture & Multi-Language Player
        run: |
          python3 - << 'EOF'
          import os, re

          master_player = """import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';

          class __CLASS_NAME__ extends StatefulWidget {
            final dynamic movie, mediaItem, media, item;
            final int? tmdbId, id, seasonNumber, season, episodeNumber, episode;
            final String? title, name;
            final bool isTv;
            final bool? isMovie;

            const __CLASS_NAME__({
              super.key,
              this.movie,
              this.mediaItem,
              this.media,
              this.item,
              this.tmdbId,
              this.id,
              this.title,
              this.name,
              this.isTv = false,
              this.isMovie,
              this.seasonNumber,
              this.season,
              this.episodeNumber,
              this.episode,
            });

            const __CLASS_NAME__.forEpisode({
              super.key,
              required int tmdbId,
              required String title,
              required int seasonNumber,
              required int episodeNumber,
              this.movie,
              this.mediaItem,
              this.media,
              this.item,
              this.id,
              this.name,
              this.isTv = true,
              this.isMovie = false,
              this.season,
              this.episode,
            }) : tmdbId = tmdbId, title = title, seasonNumber = seasonNumber, episodeNumber = episodeNumber;

            @override
            State<__CLASS_NAME__> createState() => ___CLASS_NAME__State();
          }

          class ___CLASS_NAME__State extends State<__CLASS_NAME__> {
            late final WebViewController _controller;
            int _selectedSourceIndex = 0;
            bool _showHud = true;
            Timer? _hudTimer;
            bool _isLoading = true;
            String? _feedbackText;
            Timer? _feedbackTimer;
            bool _autoSwitched = false;

            int get _resolvedId {
              if (widget.tmdbId != null && widget.tmdbId! > 0) return widget.tmdbId!;
              if (widget.id != null && widget.id! > 0) return widget.id!;
              for (var obj in [widget.mediaItem, widget.movie, widget.media, widget.item]) {
                if (obj != null) {
                  try {
                    final val = obj.id;
                    if (val != null && val is int && val > 0) return val;
                  } catch (_) {}
                }
              }
              return 0;
            }

            String get _resolvedTitle {
              if (widget.title != null && widget.title!.isNotEmpty) return widget.title!;
              if (widget.name != null && widget.name!.isNotEmpty) return widget.name!;
              for (var obj in [widget.mediaItem, widget.movie, widget.media, widget.item]) {
                if (obj != null) {
                  try {
                    final t = obj.title ?? obj.name;
                    if (t != null && t.toString().isNotEmpty) return t.toString();
                  } catch (_) {}
                }
              }
              return 'Streaming';
            }

            bool get _resolvedIsTv {
              if (widget.isTv) return true;
              if (widget.seasonNumber != null && widget.seasonNumber! > 0) return true;
              if (widget.season != null && widget.season! > 0) return true;
              for (var obj in [widget.mediaItem, widget.movie, widget.media, widget.item]) {
                if (obj != null) {
                  try {
                    if (obj.mediaType == 'tv') return true;
                  } catch (_) {}
                }
              }
              return false;
            }

            bool get _isPakistaniDrama {
              final t = _resolvedTitle.toLowerCase();
              final pkKeywords = ['noor jahan', 'fraud', 'ertugrul', 'parizaad', 'tere bin', 'ishq murshid', 'fairy tale', 'khuda aur mohabbat'];
              for (var k in pkKeywords) {
                if (t.contains(k)) return true;
              }
              return false;
            }

            List<Map<String, String>> get _audioOptions {
              final id = _resolvedId;
              final s = widget.seasonNumber ?? widget.season ?? 1;
              final e = widget.episodeNumber ?? widget.episode ?? 1;
              final qTitle = Uri.encodeComponent('$_resolvedTitle ep $e full episode HD');

              if (_resolvedIsTv) {
                if (_isPakistaniDrama) {
                  return [
                    {
                      'label': 'Urdu Official HD (Direct)',
                      'badge': 'PAKISTANI DRAMA',
                      'url': 'https://www.youtube.com/embed?listType=search&list=$qTitle&autoplay=1',
                    },
                    {
                      'label': 'Hindi / Urdu Multi-Audio',
                      'badge': 'DUBBED',
                      'url': 'https://multiembed.mov/?video_id=$id&tmdb=1&s=$s&e=$e&autoplay=1',
                    },
                    {
                      'label': 'English / Original HD',
                      'badge': 'ULTRA HD',
                      'url': 'https://vidlink.pro/tv/$id/$s/$e?autoplay=true',
                    },
                  ];
                } else {
                  return [
                    {
                      'label': 'English (Original Audio)',
                      'badge': 'FAST HD',
                      'url': 'https://vidlink.pro/tv/$id/$s/$e?autoplay=true',
                    },
                    {
                      'label': 'Hindi Dubbed / Dual Audio',
                      'badge': 'MULTI-AUDIO',
                      'url': 'https://multiembed.mov/?video_id=$id&tmdb=1&s=$s&e=$e&autoplay=1',
                    },
                    {
                      'label': 'Anime & Global Stream',
                      'badge': 'SUB/DUB',
                      'url': 'https://player.autoembed.cc/embed/tv/$id/$s/$e',
                    },
                    {
                      'label': 'Alternative Official Stream',
                      'badge': 'BACKUP',
                      'url': 'https://www.youtube.com/embed?listType=search&list=$qTitle&autoplay=1',
                    },
                  ];
                }
              } else {
                return [
                  {
                    'label': 'English (Original Audio)',
                    'badge': 'FAST HD',
                    'url': 'https://vidlink.pro/movie/$id?autoplay=true',
                  },
                  {
                    'label': 'Hindi Dubbed / Multi-Audio',
                    'badge': 'MULTI-AUDIO',
                    'url': 'https://multiembed.mov/?video_id=$id&tmdb=1&autoplay=1',
                  },
                  {
                    'label': 'Ultra Stream (Backup)',
                    'badge': '1080P',
                    'url': 'https://vidsrc.cc/v2/embed/movie/$id',
                  },
                ];
              }
            }

            @override
            void initState() {
              super.initState();
              SystemChrome.setPreferredOrientations([
                DeviceOrientation.landscapeLeft,
                DeviceOrientation.landscapeRight,
              ]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
              WakelockPlus.enable();

              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setUserAgent('Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36')
                ..setBackgroundColor(Colors.black)
                ..addJavaScriptChannel(
                  'StreamWatcher',
                  onMessageReceived: (JavaScriptMessage msg) {
                    if (msg.message == 'NOT_AVAILABLE') {
                      _handleStreamFailure();
                    }
                  },
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (_) {
                      if (mounted) setState(() => _isLoading = true);
                    },
                    onPageFinished: (_) {
                      if (mounted) setState(() => _isLoading = false);
                      _injectAutoTriggerAndObserver();
                    },
                    onNavigationRequest: (req) {
                      final u = req.url.toLowerCase();
                      if (u.startsWith('blob:') ||
                          u.startsWith('about:') ||
                          u.contains('vidlink') ||
                          u.contains('multiembed') ||
                          u.contains('autoembed') ||
                          u.contains('youtube') ||
                          u.contains('vidsrc') ||
                          u.contains('m3u8') ||
                          u.contains('mp4')) {
                        return NavigationDecision.navigate;
                      }
                      return NavigationDecision.prevent;
                    },
                  ),
                )
                ..loadRequest(Uri.parse(_audioOptions[_selectedSourceIndex]['url']!));

              _startHudTimer();
            }

            void _handleStreamFailure() {
              if (_autoSwitched) return;
              _autoSwitched = true;
              if (mounted) {
                _triggerFeedback('Switching to alternate stream... 🔄');
                Timer(const Duration(seconds: 1), () {
                  if (mounted && _selectedSourceIndex + 1 < _audioOptions.length) {
                    setState(() {
                      _selectedSourceIndex++;
                      _isLoading = true;
                    });
                    _controller.loadRequest(Uri.parse(_audioOptions[_selectedSourceIndex]['url']!));
                  }
                });
              }
            }

            void _injectAutoTriggerAndObserver() {
              const js = '''
                (function() {
                  window.open = function() { return null; };

                  function checkNotAvailable() {
                    var bodyText = document.body ? document.body.innerText : '';
                    if (bodyText.includes("Couldn't Find This Content") || 
                        bodyText.includes("Not Available") || 
                        bodyText.includes("404 Not Found") || 
                        bodyText.includes("Video not found")) {
                      StreamWatcher.postMessage('NOT_AVAILABLE');
                    }
                  }

                  setInterval(function() {
                    checkNotAvailable();
                    var btn = document.querySelector('.play-btn, .vjs-big-play-button, button[aria-label="Play"], #play, .jw-display-icon-display, svg[data-icon="play"]');
                    if (btn) btn.click();
                    var v = document.querySelector('video');
                    if (v && v.paused) {
                      v.play().catch(function(){});
                    }
                  }, 500);
                })();
              ''';
              _controller.runJavaScript(js).catchError((_) {});
            }

            void _seekBy(int seconds) {
              final js = "var v = document.querySelector('video'); if(v) { v.currentTime += $seconds; }";
              _controller.runJavaScript(js).catchError((_) {});
              _triggerFeedback(seconds > 0 ? '+$seconds Sec ⏩' : '$seconds Sec ⏪');
            }

            void _togglePlayPause() {
              const js = "var v = document.querySelector('video'); if(v) { if(v.paused) { v.play(); } else { v.pause(); } }";
              _controller.runJavaScript(js).catchError((_) {});
              _triggerFeedback('Play / Pause ⏯️');
            }

            void _unmuteAudio() {
              const js = "var v = document.querySelector('video'); if(v) { v.muted = false; v.volume = 1.0; }";
              _controller.runJavaScript(js).catchError((_) {});
              _triggerFeedback('Audio Unmuted 🔊');
            }

            void _triggerFeedback(String text) {
              setState(() => _feedbackText = text);
              _feedbackTimer?.cancel();
              _feedbackTimer = Timer(const Duration(milliseconds: 1400), () {
                if (mounted) setState(() => _feedbackText = null);
              });
            }

            void _startHudTimer() {
              _hudTimer?.cancel();
              _hudTimer = Timer(const Duration(seconds: 4), () {
                if (mounted) setState(() => _showHud = false);
              });
            }

            void _toggleHud() {
              setState(() => _showHud = !_showHud);
              if (_showHud) _startHudTimer();
            }

            void _showAudioLanguageSheet() {
              _hudTimer?.cancel();
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF141414),
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(16)),
                ),
                builder: (ctx) {
                  return SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.symmetric(vertical: 14, horizontal: 16),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              const Text('Audio & Stream Options', style: TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold)),
                              IconButton(icon: const Icon(Icons.close, color: Colors.white54, size: 20), onPressed: () => Navigator.pop(ctx)),
                            ],
                          ),
                          const SizedBox(height: 8),
                          ...List.generate(_audioOptions.length, (idx) {
                            final isSel = idx == _selectedSourceIndex;
                            final opt = _audioOptions[idx];
                            return Container(
                              margin: const EdgeInsets.symmetric(vertical: 4),
                              decoration: BoxDecoration(
                                color: isSel ? Colors.redAccent.withOpacity(0.15) : Colors.white.withOpacity(0.04),
                                borderRadius: BorderRadius.circular(10),
                                border: Border.all(color: isSel ? Colors.redAccent : Colors.transparent),
                              ),
                              child: ListTile(
                                dense: true,
                                leading: Icon(
                                  idx == 1 ? Icons.translate_rounded : (opt['badge'] == 'PAKISTANI DRAMA' ? Icons.live_tv_rounded : Icons.audiotrack_rounded),
                                  color: isSel ? Colors.redAccent : Colors.white70,
                                  size: 22,
                                ),
                                title: Text(opt['label']!, style: TextStyle(color: isSel ? Colors.redAccent : Colors.white, fontSize: 14, fontWeight: isSel ? FontWeight.bold : FontWeight.normal)),
                                subtitle: Text(opt['badge']!, style: TextStyle(color: isSel ? Colors.redAccent.withOpacity(0.8) : Colors.white38, fontSize: 10.5, fontWeight: FontWeight.w600)),
                                trailing: isSel ? const Icon(Icons.check_circle, color: Colors.redAccent, size: 18) : null,
                                onTap: () {
                                  Navigator.pop(ctx);
                                  setState(() {
                                    _selectedSourceIndex = idx;
                                    _isLoading = true;
                                    _autoSwitched = false;
                                  });
                                  _controller.loadRequest(Uri.parse(opt['url']!));
                                  _startHudTimer();
                                },
                              ),
                            );
                          }),
                          const SizedBox(height: 12),
                        ],
                      ),
                    ),
                  );
                },
              ).then((_) => _startHudTimer());
            }

            @override
            void dispose() {
              _hudTimer?.cancel();
              _feedbackTimer?.cancel();
              SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
              WakelockPlus.disable();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _controller),

                      // Gesture Zones: Left = -10s, Middle = Show/Hide, Right = +10s
                      Positioned.fill(
                        child: Row(
                          children: [
                            Expanded(
                              child: GestureDetector(
                                behavior: HitTestBehavior.translucent,
                                onDoubleTap: () => _seekBy(-10),
                                onTap: _toggleHud,
                              ),
                            ),
                            Expanded(
                              child: GestureDetector(
                                behavior: HitTestBehavior.translucent,
                                onDoubleTap: _togglePlayPause,
                                onTap: _toggleHud,
                              ),
                            ),
                            Expanded(
                              child: GestureDetector(
                                behavior: HitTestBehavior.translucent,
                                onDoubleTap: () => _seekBy(10),
                                onTap: _toggleHud,
                              ),
                            ),
                          ],
                        ),
                      ),

                      // Feedback Badge (+10s, -10s, etc)
                      if (_feedbackText != null)
                        Center(
                          child: Container(
                            padding: const EdgeInsets.symmetric(horizontal: 22, vertical: 12),
                            decoration: BoxDecoration(
                              color: Colors.black87,
                              borderRadius: BorderRadius.circular(25),
                              border: Border.all(color: Colors.redAccent, width: 1.2),
                            ),
                            child: Text(
                              _feedbackText!,
                              style: const TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold),
                            ),
                          ),
                        ),

                      if (_isLoading)
                        Container(
                          color: Colors.black,
                          child: Center(
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const CircularProgressIndicator(color: Colors.redAccent),
                                const SizedBox(height: 16),
                                Text(
                                  'Loading ${_audioOptions[_selectedSourceIndex]['label']}...',
                                  style: const TextStyle(color: Colors.white70, fontSize: 13),
                                ),
                              ],
                            ),
                          ),
                        ),

                      // Top Bar (Back button, Title & Audio/Language Button)
                      AnimatedOpacity(
                        duration: const Duration(milliseconds: 250),
                        opacity: _showHud ? 1.0 : 0.0,
                        child: IgnorePointer(
                          ignoring: !_showHud,
                          child: Container(
                            padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                            decoration: BoxDecoration(
                              gradient: LinearGradient(
                                colors: [Colors.black.withOpacity(0.9), Colors.transparent],
                                begin: Alignment.topCenter,
                                end: Alignment.bottomCenter,
                              ),
                            ),
                            child: Row(
                              children: [
                                InkWell(
                                  borderRadius: BorderRadius.circular(20),
                                  onTap: () => Navigator.pop(context),
                                  child: Container(
                                    padding: const EdgeInsets.all(8),
                                    decoration: BoxDecoration(
                                      color: Colors.black54,
                                      shape: BoxShape.circle,
                                    ),
                                    child: const Icon(Icons.arrow_back_ios_new, color: Colors.white, size: 18),
                                  ),
                                ),
                                const SizedBox(width: 14),
                                Expanded(
                                  child: Text(
                                    _resolvedTitle,
                                    maxLines: 1,
                                    overflow: TextOverflow.ellipsis,
                                    style: const TextStyle(color: Colors.white, fontSize: 15, fontWeight: FontWeight.bold),
                                  ),
                                ),
                                InkWell(
                                  borderRadius: BorderRadius.circular(20),
                                  onTap: _showAudioLanguageSheet,
                                  child: Container(
                                    padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 7),
                                    decoration: BoxDecoration(
                                      color: Colors.redAccent.withOpacity(0.2),
                                      borderRadius: BorderRadius.circular(20),
                                      border: Border.all(color: Colors.redAccent, width: 0.9),
                                    ),
                                    child: Row(
                                      mainAxisSize: MainAxisSize.min,
                                      children: [
                                        const Icon(Icons.translate_rounded, color: Colors.redAccent, size: 15),
                                        const SizedBox(width: 6),
                                        Text(
                                          _audioOptions[_selectedSourceIndex]['badge']!,
                                          style: const TextStyle(color: Colors.white, fontSize: 11.5, fontWeight: FontWeight.bold),
                                        ),
                                        const SizedBox(width: 4),
                                        const Icon(Icons.keyboard_arrow_down, color: Colors.white70, size: 15),
                                      ],
                                    ),
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),

                      // Bottom Large Native Floating Controls Bar
                      AnimatedOpacity(
                        duration: const Duration(milliseconds: 250),
                        opacity: _showHud ? 1.0 : 0.0,
                        child: IgnorePointer(
                          ignoring: !_showHud,
                          child: Align(
                            alignment: Alignment.bottomCenter,
                            child: Container(
                              margin: const EdgeInsets.only(bottom: 16),
                              padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 8),
                              decoration: BoxDecoration(
                                color: Colors.black.withOpacity(0.85),
                                borderRadius: BorderRadius.circular(35),
                                border: Border.all(color: Colors.white24, width: 0.8),
                              ),
                              child: Row(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  IconButton(
                                    icon: const Icon(Icons.replay_10_rounded, color: Colors.white, size: 30),
                                    onPressed: () => _seekBy(-10),
                                  ),
                                  const SizedBox(width: 12),
                                  IconButton(
                                    icon: const Icon(Icons.play_circle_filled_rounded, color: Colors.redAccent, size: 44),
                                    onPressed: _togglePlayPause,
                                  ),
                                  const SizedBox(width: 12),
                                  IconButton(
                                    icon: const Icon(Icons.forward_10_rounded, color: Colors.white, size: 30),
                                    onPressed: () => _seekBy(10),
                                  ),
                                  const SizedBox(width: 16),
                                  Container(height: 26, width: 1, color: Colors.white24),
                                  const SizedBox(width: 12),
                                  IconButton(
                                    icon: const Icon(Icons.volume_up_rounded, color: Colors.white, size: 28),
                                    onPressed: _unmuteAudio,
                                    tooltip: 'Unmute',
                                  ),
                                ],
                              ),
                            ),
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          """

          for root, _, files in os.walk('lib'):
              for f in files:
                  if f.endswith('.dart'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fl:
                          c = fl.read()
                      if ('Could not load the player' in c) or ('_currentServer' in c) or ('PlayerScreen' in c) or ('WatchScreen' in c):
                          m = re.search(r'class\s+([A-Za-z0-9_]+)\s+extends\s+StatefulWidget', c)
                          class_name = m.group(1) if m else 'PlayerScreen'
                          code = master_player.replace('__CLASS_NAME__', class_name)
                          with open(p, 'w', encoding='utf-8') as fl:
                              fl.write(code)

          for loc in ['lib/screens/player/player_screen.dart', 'lib/screens/player_screen.dart']:
              os.makedirs(os.path.dirname(loc), exist_ok=True)
              code = master_player.replace('__CLASS_NAME__', 'PlayerScreen')
              with open(loc, 'w', encoding='utf-8') as fl:
                  fl.write(code)
          EOF

      - name: Patch Android SDK 35, Proguard & Java Baklava Fix
        run: |
          python3 - << 'EOF'
          import os, re

          for root, _, files in os.walk('android'):
              for f in files:
                  if f.startswith('build.gradle'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fl:
                          c = fl.read()
                      c = re.sub(r'compileSdk(Version)?\s*=?\s*(flutter\.)?compileSdkVersion', 'compileSdk = 35', c)
                      c = re.sub(r'compileSdkVersion\s+[0-9]+', 'compileSdkVersion 35', c)
                      c = re.sub(r'compileSdk\s*=\s*[0-9]+', 'compileSdk = 35', c)
                      c = c.replace('proguard-android.txt', 'proguard-android-optimize.txt')
                      with open(p, 'w', encoding='utf-8') as fl:
                          fl.write(c)

          cache_dir = os.path.expanduser('~/.pub-cache')
          for root, _, files in os.walk(cache_dir):
              for f in files:
                  if f.endswith('.gradle'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fl:
                          c = fl.read()
                      c = re.sub(r'compileSdkVersion\s+[0-9]+', 'compileSdkVersion 35', c)
                      c = re.sub(r'compileSdk\s*=\s*[0-9]+', 'compileSdk = 35', c)
                      c = c.replace('proguard-android.txt', 'proguard-android-optimize.txt')
                      with open(p, 'w', encoding='utf-8') as fl:
                          fl.write(c)

          for root, _, files in os.walk(cache_dir):
              for f in files:
                  if f.endswith('.java'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fl:
                          c = fl.read()
                      if 'BAKLAVA' in c or 'Locale.of' in c or 'thread.threadId()' in c:
                          c = c.replace('Build.VERSION_CODES.BAKLAVA', '999')
                          c = c.replace('Locale.of(language, country, variant)', 'new Locale(language, country, variant)')
                          c = c.replace('thread.threadId()', 'thread.getId()')
                          with open(p, 'w', encoding='utf-8') as fl:
                              fl.write(c)
          EOF

          cat << 'EOF' >> android/build.gradle

          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          try { compileSdkVersion 35 } catch (e) {}
                          try { compileSdk = 35 } catch (e) {}
                      }
                  }
              }
          }
          EOF

      - name: Build and Sign Valid APK (v2 & v3 Scheme)
        run: |
          flutter build apk --release || true

          APK_FILE=$(find android build -name "*.apk" 2>/dev/null | grep -E "release|app" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            cd android && ./gradlew assembleRelease && cd ..
            APK_FILE=$(find android build -name "*.apk" 2>/dev/null | grep -E "release|app" | head -n 1)
          fi

          mkdir -p build/app/outputs/flutter-apk
          TARGET_APK="build/app/outputs/flutter-apk/app-release.apk"

          BT_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)

          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          $BT_DIR/zipalign -f -p 4 "$APK_FILE" aligned.apk
          $BT_DIR/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out "$TARGET_APK" aligned.apk
          $BT_DIR/apksigner verify --verbose "$TARGET_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jmovies-apk
          path: build/app/outputs/flutter-apk/*.apk
