name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Backup Native Files
        run: |
          mkdir -p /tmp/backup_screens /tmp/backup_services
          cp lib/screens/player/player_screen.dart /tmp/backup_screens/ 2>/dev/null || true
          cp lib/data/services/m3u8_extractor_service.dart /tmp/backup_services/ 2>/dev/null || true

      - name: Extract ZIP
        run: |
          LATEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -n "$LATEST_ZIP" ]; then
            unzip -o "$LATEST_ZIP"
          fi
          if [ ! -f "pubspec.yaml" ]; then
            DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            cp -r $DIR/* .
          fi

      - name: Restore Native Files
        run: |
          mkdir -p lib/screens/player lib/data/services
          cp -f /tmp/backup_screens/player_screen.dart lib/screens/player/ 2>/dev/null || true
          cp -f /tmp/backup_services/m3u8_extractor_service.dart lib/data/services/ 2>/dev/null || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project & Configure Gradle
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.jmovies.app
          mkdir -p assets/icons assets/images
          
          # Permissions in Manifest
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml
          
          # Safe patch for both .gradle and .gradle.kts (Sets minSdk 21 & compileSdk 34)
          find android -name "build.gradle.kts" -exec sed -i -E 's/minSdk = .*/minSdk = 21/g' {} + 2>/dev/null || true
          find android -name "build.gradle.kts" -exec sed -i -E 's/compileSdk = .*/compileSdk = 34/g' {} + 2>/dev/null || true
          find android -name "build.gradle" -exec sed -i -E 's/minSdkVersion .*/minSdkVersion 21/g' {} + 2>/dev/null || true
          find android -name "build.gradle" -exec sed -i -E 's/minSdk = .*/minSdk = 21/g' {} + 2>/dev/null || true
          find android -name "build.gradle" -exec sed -i -E 's/compileSdkVersion .*/compileSdkVersion 34/g' {} + 2>/dev/null || true
          find android -name "build.gradle" -exec sed -i -E 's/compileSdk = .*/compileSdk = 34/g' {} + 2>/dev/null || true

          # Gradle performance & Jetifier settings
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties

      - name: Install Dependencies
        run: |
          flutter pub add video_player wakelock_plus http 2>/dev/null || true
          flutter pub get
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i -E 's/compileSdkVersion[ =]+[0-9]+/compileSdkVersion 34/g' {} + 2>/dev/null || true
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i -E 's/compileSdk[ =]+[0-9]+/compileSdk 34/g' {} + 2>/dev/null || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jmovies-apk
          path: build/app/outputs/flutter-apk/*.apk
