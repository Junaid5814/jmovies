name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o jmovies.zip
          if [ ! -f "pubspec.yaml" ]; then
            DIR=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \;)
            if [ -n "$DIR" ]; then
              cp -r $DIR/* .
            fi
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Clean Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.jmovies.app
          mkdir -p assets/icons assets/images
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Configure .env and Assets
        run: |
          KEY="75509b000dc883c256e0c2de5d700731"
          TOKEN="eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI3NTUwOWIwMDBkYzg4M2MyNTZlMGMyZGU1ZDcwMDczMSIsIm5iZiI6MTc4OTI5NDQ3My45NDgsInN1YiI6IjZhYTY3Nzg5YjFmNzgyMjZjYjU3ODAyNSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.WwbQQKw8Lyq2fUkg-QvDzPSBoOtefx9Vb7llwfD_-_c"
          cat << EOF > .env
          TMDB_API_KEY=$KEY
          API_KEY=$KEY
          TMDB_KEY=$KEY
          TMDB_READ_TOKEN=$TOKEN
          BASE_URL=https://api.themoviedb.org/3
          IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500
          EOF
          cp .env assets/.env
          if ! grep -q "\.env" pubspec.yaml; then
            sed -i '/flutter:/a \  assets:\n    - .env\n    - assets/\n    - assets/images/\n    - assets/icons/' pubspec.yaml
          fi

      - name: Fix Slow Internet, Timeouts & Permanent Key Injection
        run: |
          python3 -c "
          import os, re

          key = '75509b000dc883c256e0c2de5d700731'

          for root, _, files in os.walk('lib'):
              for f in files:
                  if f.endswith('.dart'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as file:
                          c = file.read()

                      # Dotenv ki bajaye direct key replace karein
                      c = re.sub(r'dotenv\.env\[[\'\"][^\'\"]*[\'\"]\]', f\"'{key}'\", c)
                      c = re.sub(r'dotenv\.get\([\'\"][^\'\"]*[\'\"][^)]*\)', f\"'{key}'\", c)

                      # Saari placeholder keys replace karein
                      c = c.replace('YOUR_TMDB_API_KEY', key).replace('YOUR_API_KEY', key).replace('your_api_key_here', key)

                      # Variables mein key pakki karein
                      c = re.sub(r'([a-zA-Z0-9_]*apiKey[a-zA-Z0-9_]*\s*=\s*)[\'\"][^\'\"]*[\'\"]', rf\"\g<1>'{key}'\", c, flags=re.IGNORECASE)
                      c = re.sub(r'([a-zA-Z0-9_]*tmdbKey[a-zA-Z0-9_]*\s*=\s*)[\'\"][^\'\"]*[\'\"]', rf\"\g<1>'{key}'\", c, flags=re.IGNORECASE)

                      # Slow internet ke liye timeout 60 seconds karein
                      c = re.sub(r'Duration\(\s*seconds\s*:\s*[0-9]+\s*\)', 'Duration(seconds: 60)', c)

                      with open(p, 'w', encoding='utf-8') as file:
                          file.write(c)
          "

      - name: Fix Dependencies & Upgrade Carousel
        run: |
          flutter pub add carousel_slider:^5.0.0
          flutter pub get

      - name: Patch Plugins to Android SDK 34
        run: |
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i -E 's/compileSdkVersion[ =]+[0-9]+/compileSdkVersion 34/g' {} + 2>/dev/null || true
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i -E 's/compileSdk[ =]+[0-9]+/compileSdk 34/g' {} + 2>/dev/null || true
          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF
          fi

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=TMDB_API_KEY=75509b000dc883c256e0c2de5d700731 \
            --dart-define=API_KEY=75509b000dc883c256e0c2de5d700731 \
            --dart-define=TMDB_KEY=75509b000dc883c256e0c2de5d700731

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jmovies-apk
          path: build/app/outputs/flutter-apk/*.apk
          
