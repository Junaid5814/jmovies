name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          LATEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          unzip -o "$LATEST_ZIP"
          if [ ! -f "pubspec.yaml" ]; then
            DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            cp -r $DIR/* .
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.jmovies.app
          mkdir -p assets/icons assets/images
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml

      - name: Pin Safe Plugins & Dependencies
        run: |
          python3 -c "c=open('pubspec.yaml').read(); open('pubspec.yaml','w').write(c.replace('dependency_overrides:','dependency_overrides:\n  sqflite_android: 2.3.3') if 'dependency_overrides:' in c else c+'\ndependency_overrides:\n  sqflite_android: 2.3.3\n')"
          flutter pub add carousel_slider:^5.0.0 webview_flutter wakelock_plus
          flutter pub get

      - name: Setup Tokens & .env
        run: |
          KEY="dac07662083decf2616c4e68d22342c9"
          TOKEN="eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJkYWMwNzY2MjA4M2RlY2YyNjE2YzRlNjhkMjIzNDJjOSIsIm5iZiI6MTc4OTI5NDQ3My45NDgsInN1YiI6IjZhYTY3Nzg5YjFmNzgyMjZjYjU3ODAyNSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.nXRm_2AAufGAeHFBuMLf4Dg5yViQ-jlTEF2CkYp6WL4"
          cat << EOF > .env
          TMDB_ACCESS_TOKEN=$TOKEN
          TMDB_API_KEY=$KEY
          BASE_URL=https://api.themoviedb.org/3
          IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500
          EOF
          cp .env assets/.env 2>/dev/null || true

      - name: Inject Branding Safely
        run: |
          python3 - << 'EOF'
          import os, re
          b = "Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisSize: MainAxisSize.min, children: const [Text('Jmovies', style: TextStyle(color: Colors.white, fontSize: 20, fontWeight: FontWeight.bold)), Text('POWERED BY JUNAID JAVED', style: TextStyle(color: Colors.redAccent, fontSize: 8.5, fontWeight: FontWeight.bold))])"
          for r, _, fs in os.walk('lib'):
            for f in fs:
              if f.endswith('.dart'):
                p = os.path.join(r, f)
                c = open(p, encoding='utf-8', errors='ignore').read()
                m = re.search(r'(const\s+)?Text\s*\(\s*[\'"]J[mM]ovies[\'"]', c)
                if m and 'JUNAID JAVED' not in c:
                  s = m.start()
                  fp = c.find('(', s)
                  if fp != -1:
                    cnt, e = 0, -1
                    for i in range(fp, len(c)):
                      if c[i] == '(': cnt += 1
                      elif c[i] == ')':
                        cnt -= 1
                        if count == 0: e = i + 1; break
                    if e != -1: open(p, 'w', encoding='utf-8').write(c[:s] + b + c[e:])
          EOF

      - name: Inject Sleek AutoPlay Player
        run: |
          mkdir -p lib/screens/player
          cat << 'EOF' > lib/screens/player/player_screen.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';

          class PlayerScreen extends StatefulWidget {
            final dynamic movie, mediaItem, media, item;
            final int? tmdbId, id, seasonNumber, season, episodeNumber, episode;
            final String? title, name;
            final bool isTv;
            const PlayerScreen({super.key, this.movie, this.mediaItem, this.media, this.item, this.tmdbId, this.id, this.title, this.name, this.isTv = false, this.seasonNumber, this.season, this.episodeNumber, this.episode});
            const PlayerScreen.forEpisode({super.key, required int tmdbId, required String title, required int seasonNumber, required int episodeNumber, this.movie, this.mediaItem, this.media, this.item, this.id, this.name, this.isTv = true, this.season, this.episode}) : tmdbId = tmdbId, title = title, seasonNumber = seasonNumber, episodeNumber = episodeNumber;
            @override State<PlayerScreen> createState() => _PlayerScreenState();
          }

          class _PlayerScreenState extends State<PlayerScreen> {
            late final WebViewController _c;
            int _s = 0;
            bool _show = true;
            Timer? _t;
            int get _id => widget.tmdbId ?? widget.id ?? widget.mediaItem?.id ?? widget.movie?.id ?? 0;
            bool get _isTv => widget.isTv || (widget.seasonNumber ?? widget.season ?? 0) > 0 || (widget.mediaItem?.mediaType == 'tv');
            List<String> get _urls {
              final id = _id, s = widget.seasonNumber ?? widget.season ?? 1, e = widget.episodeNumber ?? widget.episode ?? 1;
              return _isTv
                ? ['https://vidlink.pro/tv/$id/$s/$e?autoplay=true', 'https://multiembed.mov/?video_id=$id&tmdb=1&s=$s&e=$e&autoplay=1', 'https://vidsrc.cc/v2/embed/tv/$id/$s/$e']
                : ['https://vidlink.pro/movie/$id?autoplay=true', 'https://multiembed.mov/?video_id=$id&tmdb=1&autoplay=1', 'https://vidsrc.cc/v2/embed/movie/$id'];
            }

            @override void initState() {
              super.initState();
              SystemChrome.setPreferredOrientations([DeviceOrientation.landscapeLeft, DeviceOrientation.landscapeRight]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
              WakelockPlus.enable();
              _c = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setUserAgent('Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36')
                ..setBackgroundColor(Colors.black)
                ..setNavigationDelegate(NavigationDelegate(
                  onPageFinished: (_) => _c.runJavaScript('(function(){window.open=function(){return null;};setInterval(function(){var b=document.querySelector(".play-btn,.vjs-big-play-button,button[aria-label=\\"Play\\"],#play");if(b)b.click();var v=document.querySelector("video");if(v&&v.paused)v.play().catch(function(){});},300);})();').catchError((_){}),
                  onNavigationRequest: (r) {
                    final u = r.url.toLowerCase();
                    return (u.startsWith('blob:') || u.contains('vidlink') || u.contains('multiembed') || u.contains('vidsrc') || u.contains('m3u8') || u.contains('mp4')) ? NavigationDecision.navigate : NavigationDecision.prevent;
                  },
                ))
                ..loadRequest(Uri.parse(_urls[_s]));
              _hide();
            }

            void _hide() { _t?.cancel(); _t = Timer(const Duration(seconds: 4), () { if(mounted) setState(() => _show = false); }); }

            @override void dispose() {
              _t?.cancel();
              SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
              WakelockPlus.disable();
              super.dispose();
            }

            @override Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: Stack(
                  children: [
                    WebViewWidget(controller: _c),
                    Positioned.fill(child: GestureDetector(behavior: HitTestBehavior.translucent, onTap: () { setState(() => _show = !_show); if(_show) _hide(); })),
                    if (_show) Positioned(top: 12, left: 12, right: 12, child: Row(
                      children: [
                        CircleAvatar(backgroundColor: Colors.black54, child: IconButton(icon: const Icon(Icons.arrow_back, color: Colors.white), onPressed: () => Navigator.pop(context))),
                        const Spacer(),
                        ElevatedButton.icon(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.black87, foregroundColor: Colors.white, side: const BorderSide(color: Colors.white24)),
                          icon: const Icon(Icons.dns, color: Colors.redAccent, size: 14),
                          label: Text('Server ${_s + 1} (Tap to Switch)', style: const TextStyle(fontSize: 12)),
                          onPressed: () {
                            setState(() => _s = (_s + 1) % _urls.length);
                            _c.loadRequest(Uri.parse(_urls[_s]));
                            _hide();
                          },
                        ),
                      ],
                    )),
                  ],
                ),
              );
            }
          }
          EOF
          cp lib/screens/player/player_screen.dart lib/screens/player_screen.dart 2>/dev/null || true

      - name: Patch Plugins (SDK 34 & Proguard)
        run: |
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i -E 's/compileSdkVersion[ =]+[0-9]+/compileSdkVersion 34/g' {} + 2>/dev/null || true
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i -E 's/compileSdk[ =]+[0-9]+/compileSdk 34/g' {} + 2>/dev/null || true
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i "s/proguard-android\.txt/proguard-android-optimize\.txt/g" {} + 2>/dev/null || true
          find . -name "build.gradle" -exec sed -i "s/proguard-android\.txt/proguard-android-optimize\.txt/g" {} + 2>/dev/null || true
          echo 'subprojects { afterEvaluate { project -> if (project.hasProperty("android")) { project.android { compileSdkVersion 34 } } } }' >> android/build.gradle

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jmovies-apk
          path: build/app/outputs/flutter-apk/*.apk
