name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o jmovies.zip
          if [ ! -f "pubspec.yaml" ]; then
            DIR=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \;)
            if [ -n "$DIR" ]; then
              cp -r $DIR/* .
            fi
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Clean Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.jmovies.app
          mkdir -p assets/icons assets/images
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Fix Carousel Slider Version 5
        run: |
          flutter pub add carousel_slider:^5.0.0
          flutter pub get

      - name: Setup Tokens & .env File
        env:
          TMDB_SECRET: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          KEY="dac07662083decf2616c4e68d22342c9"
          TOKEN="${TMDB_SECRET:-eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJkYWMwNzY2MjA4M2RlY2YyNjE2YzRlNjhkMjIzNDJjOSIsIm5iZiI6MTc4OTI5NDQ3My45NDgsInN1YiI6IjZhYTY3Nzg5YjFmNzgyMjZjYjU3ODAyNSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.nXRm_2AAufGAeHFBuMLf4Dg5yViQ-jlTEF2CkYp6WL4}"

          cat << EOF > .env
          TMDB_ACCESS_TOKEN=$TOKEN
          TMDB_READ_TOKEN=$TOKEN
          TMDB_TOKEN=$TOKEN
          ACCESS_TOKEN=$TOKEN
          TOKEN=$TOKEN
          TMDB_API_KEY=$KEY
          API_KEY=$KEY
          TMDB_KEY=$KEY
          BASE_URL=https://api.themoviedb.org/3
          IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500
          EOF

          cp .env assets/.env

          if ! grep -q "\.env" pubspec.yaml; then
            sed -i '/flutter:/a \  assets:\n    - .env\n    - assets/\n    - assets/images/\n    - assets/icons/' pubspec.yaml
          fi

      - name: Smart Key and Bearer Token Injection
        env:
          TMDB_SECRET: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          export KEY="dac07662083decf2616c4e68d22342c9"
          export TOKEN="${TMDB_SECRET:-eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJkYWMwNzY2MjA4M2RlY2YyNjE2YzRlNjhkMjIzNDJjOSIsIm5iZiI6MTc4OTI5NDQ3My45NDgsInN1YiI6IjZhYTY3Nzg5YjFmNzgyMjZjYjU3ODAyNSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.nXRm_2AAufGAeHFBuMLf4Dg5yViQ-jlTEF2CkYp6WL4}"

          python3 - << 'EOF'
          import os, re

          key = os.environ.get("KEY", "")
          token = os.environ.get("TOKEN", "")

          for root, _, files in os.walk("lib"):
              for f in files:
                  if f.endswith(".dart"):
                      p = os.path.join(root, f)
                      with open(p, "r", encoding="utf-8", errors="ignore") as file:
                          content = file.read()

                      # Dotenv mapping
                      def replace_dotenv(m):
                          var = m.group(1).upper()
                          if "TOKEN" in var or "AUTH" in var:
                              return f"'{token}'"
                          return f"'{key}'"

                      content = re.sub(r"dotenv\.(?:env\[|get\()[\'\"]([^\'\"]+)[\'\"](?:\]|\))", replace_dotenv, content)

                      # Placeholders
                      content = content.replace("YOUR_TMDB_API_KEY", key).replace("YOUR_API_KEY", key).replace("your_api_key_here", key)
                      content = content.replace("YOUR_READ_ACCESS_TOKEN", token).replace("YOUR_ACCESS_TOKEN", token).replace("YOUR_TOKEN", token)

                      # Variables
                      content = re.sub(r'([a-zA-Z0-9_]*token[a-zA-Z0-9_]*\s*=\s*)[\'\"][^\'\"]*[\'\"]', rf"\g<1>'{token}'", content, flags=re.IGNORECASE)
                      content = re.sub(r'([a-zA-Z0-9_]*bearer[a-zA-Z0-9_]*\s*=\s*)[\'\"][^\'\"]*[\'\"]', rf"\g<1>'{token}'", content, flags=re.IGNORECASE)

                      def replace_key(m):
                          var = m.group(1)
                          if "token" in var.lower():
                              return f"{var}'{token}'"
                          return f"{var}'{key}'"

                      content = re.sub(r'([a-zA-Z0-9_]*key[a-zA-Z0-9_]*\s*=\s*)[\'\"][^\'\"]*[\'\"]', replace_key, content, flags=re.IGNORECASE)

                      # Fix Bearer header
                      content = content.replace(f"Bearer {key}", f"Bearer {token}")

                      # Slow net timeout (60s)
                      content = re.sub(r'Duration\(\s*seconds\s*:\s*[0-9]+\s*\)', 'Duration(seconds: 60)', content)

                      with open(p, "w", encoding="utf-8") as file:
                          file.write(content)
          EOF

      - name: Patch Plugins to Android SDK 34
        run: |
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i -E 's/compileSdkVersion[ =]+[0-9]+/compileSdkVersion 34/g' {} + 2>/dev/null || true
          find $HOME/.pub-cache -name "build.gradle" -exec sed -i -E 's/compileSdk[ =]+[0-9]+/compileSdk 34/g' {} + 2>/dev/null || true
          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jmovies-apk
          path: build/app/outputs/flutter-apk/*.apk
          
