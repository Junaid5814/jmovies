name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          LATEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          unzip -o "$LATEST_ZIP"
          if [ ! -f "pubspec.yaml" ]; then
            DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            cp -r $DIR/* .
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.jmovies.app
          mkdir -p assets/icons assets/images
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml

      - name: Add Dependencies
        run: |
          flutter pub add carousel_slider:^5.0.0 webview_flutter wakelock_plus
          flutter pub get

      - name: Setup Tokens & .env File
        run: |
          KEY="dac07662083decf2616c4e68d22342c9"
          TOKEN="eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJkYWMwNzY2MjA4M2RlY2YyNjE2YzRlNjhkMjIzNDJjOSIsIm5iZiI6MTc4OTI5NDQ3My45NDgsInN1YiI6IjZhYTY3Nzg5YjFmNzgyMjZjYjU3ODAyNSIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.nXRm_2AAufGAeHFBuMLf4Dg5yViQ-jlTEF2CkYp6WL4"
          cat << EOF > .env
          TMDB_ACCESS_TOKEN=$TOKEN
          TMDB_API_KEY=$KEY
          BASE_URL=https://api.themoviedb.org/3
          IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500
          EOF
          cp .env assets/.env 2>/dev/null || true

      - name: Inject Branding Safely
        run: |
          python3 - << 'EOF'
          import os, re
          branding = """Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            mainAxisSize: MainAxisSize.min,
            children: const [
              Text('Jmovies', style: TextStyle(color: Colors.white, fontSize: 20, fontWeight: FontWeight.bold)),
              Text('POWERED BY JUNAID JAVED', style: TextStyle(color: Colors.redAccent, fontSize: 8.5, fontWeight: FontWeight.bold, letterSpacing: 1.1)),
            ],
          )"""
          for r, _, fs in os.walk('lib'):
            for f in fs:
              if f.endswith('.dart'):
                p = os.path.join(r, f)
                with open(p, 'r', encoding='utf-8', errors='ignore') as fl: t = fl.read()
                m = re.search(r'(const\s+)?Text\s*\(\s*[\'"]J[mM]ovies[\'"]', t)
                if m and 'JUNAID JAVED' not in t:
                  start = m.start()
                  first_paren = t.find('(', start)
                  if first_paren != -1:
                    count, end = 0, -1
                    for i in range(first_paren, len(t)):
                      if t[i] == '(': count += 1
                      elif t[i] == ')':
                        count -= 1
                        if count == 0: end = i + 1; break
                    if end != -1:
                      t = t[:start] + branding + t[end:]
                      with open(p, 'w', encoding='utf-8') as fl: fl.write(t)
          EOF

      - name: Inject Auto-Play Clean Player
        run: |
          mkdir -p lib/screens/player
          cat << 'EOF' > lib/screens/player/player_screen.dart
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:wakelock_plus/wakelock_plus.dart';

          class PlayerScreen extends StatefulWidget {
            final dynamic movie;
            final dynamic mediaItem;
            final dynamic media;
            final dynamic item;
            final int? tmdbId;
            final int? id;
            final String? title;
            final String? name;
            final bool isTv;
            final bool? isMovie;
            final int? seasonNumber;
            final int? season;
            final int? episodeNumber;
            final int? episode;

            const PlayerScreen({
              super.key,
              this.movie,
              this.mediaItem,
              this.media,
              this.item,
              this.tmdbId,
              this.id,
              this.title,
              this.name,
              this.isTv = false,
              this.isMovie,
              this.seasonNumber,
              this.season,
              this.episodeNumber,
              this.episode,
            });

            const PlayerScreen.forEpisode({
              super.key,
              required int tmdbId,
              required String title,
              required int seasonNumber,
              required int episodeNumber,
              this.movie,
              this.mediaItem,
              this.media,
              this.item,
              this.id,
              this.name,
              this.isTv = true,
              this.isMovie = false,
              this.season,
              this.episode,
            }) : tmdbId = tmdbId, title = title, seasonNumber = seasonNumber, episodeNumber = episodeNumber;

            @override
            State<PlayerScreen> createState() => _PlayerScreenState();
          }

          class _PlayerScreenState extends State<PlayerScreen> {
            late final WebViewController _controller;
            int _currentServer = 0;
            bool _showControls = true;
            Timer? _hideTimer;
            bool _isLoading = true;

            int get _resolvedId {
              if (widget.tmdbId != null && widget.tmdbId! > 0) return widget.tmdbId!;
              if (widget.id != null && widget.id! > 0) return widget.id!;
              for (var obj in [widget.mediaItem, widget.movie, widget.media, widget.item]) {
                if (obj != null) {
                  try {
                    final val = obj.id;
                    if (val != null && val is int && val > 0) return val;
                  } catch (_) {}
                }
              }
              return 0;
            }

            String get _resolvedTitle {
              if (widget.title != null && widget.title!.isNotEmpty) return widget.title!;
              if (widget.name != null && widget.name!.isNotEmpty) return widget.name!;
              for (var obj in [widget.mediaItem, widget.movie, widget.media, widget.item]) {
                if (obj != null) {
                  try {
                    final t = obj.title ?? obj.name;
                    if (t != null && t.toString().isNotEmpty) return t.toString();
                  } catch (_) {}
                }
              }
              return 'Streaming';
            }

            bool get _resolvedIsTv {
              if (widget.isTv) return true;
              if (widget.seasonNumber != null && widget.seasonNumber! > 0) return true;
              if (widget.season != null && widget.season! > 0) return true;
              for (var obj in [widget.mediaItem, widget.movie, widget.media, widget.item]) {
                if (obj != null) {
                  try {
                    if (obj.mediaType == 'tv') return true;
                  } catch (_) {}
                }
              }
              return false;
            }

            List<Map<String, String>> get _servers {
              final id = _resolvedId;
              final s = widget.seasonNumber ?? widget.season ?? 1;
              final e = widget.episodeNumber ?? widget.episode ?? 1;

              if (_resolvedIsTv) {
                return [
                  {'name': 'Server 1 (VidLink AutoPlay)', 'url': 'https://vidlink.pro/tv/$id/$s/$e?autoplay=true'},
                  {'name': 'Server 2 (MultiEmbed Hindi/Dub)', 'url': 'https://multiembed.mov/?video_id=$id&tmdb=1&s=$s&e=$e&autoplay=1'},
                  {'name': 'Server 3 (VidSrc Backup)', 'url': 'https://vidsrc.cc/v2/embed/tv/$id/$s/$e'},
                ];
              } else {
                return [
                  {'name': 'Server 1 (VidLink AutoPlay)', 'url': 'https://vidlink.pro/movie/$id?autoplay=true'},
                  {'name': 'Server 2 (MultiEmbed Hindi/Dub)', 'url': 'https://multiembed.mov/?video_id=$id&tmdb=1&autoplay=1'},
                  {'name': 'Server 3 (VidSrc Backup)', 'url': 'https://vidsrc.cc/v2/embed/movie/$id'},
                ];
              }
            }

            @override
            void initState() {
              super.initState();
              SystemChrome.setPreferredOrientations([
                DeviceOrientation.landscapeLeft,
                DeviceOrientation.landscapeRight,
              ]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
              WakelockPlus.enable();

              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setUserAgent('Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36')
                ..setBackgroundColor(Colors.black)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (_) {
                      if (mounted) setState(() => _isLoading = true);
                    },
                    onPageFinished: (_) {
                      if (mounted) setState(() => _isLoading = false);
                      _injectAutoTrigger();
                    },
                    onNavigationRequest: (req) {
                      final url = req.url.toLowerCase();
                      if (url.startsWith('blob:') ||
                          url.startsWith('about:') ||
                          url.contains('vidlink') ||
                          url.contains('multiembed') ||
                          url.contains('vidsrc') ||
                          url.contains('m3u8') ||
                          url.contains('mp4')) {
                        return NavigationDecision.navigate;
                      }
                      return NavigationDecision.prevent;
                    },
                  ),
                )
                ..loadRequest(Uri.parse(_servers[_currentServer]['url']!));

              _startHideTimer();
            }

            void _injectAutoTrigger() {
              const js = """
                (function() {
                  window.open = function() { return null; };
                  setInterval(function() {
                    const btn = document.querySelector('.play-btn, .vjs-big-play-button, button[aria-label="Play"], #play, .jw-display-icon-display, svg[data-icon="play"]');
                    if (btn) btn.click();
                    const v = document.querySelector('video');
                    if (v && v.paused) v.play().catch(function(){});
                  }, 350);
                })();
              """;
              _controller.runJavaScript(js).catchError((_) {});
            }

            void _startHideTimer() {
              _hideTimer?.cancel();
              _hideTimer = Timer(const Duration(seconds: 4), () {
                if (mounted) setState(() => _showControls = false);
              });
            }

            void _toggleControls() {
              setState(() => _showControls = !_showControls);
              if (_showControls) _startHideTimer();
            }

            void _showServerSheet() {
              _hideTimer?.cancel();
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF141414),
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(16)),
                ),
                builder: (ctx) {
                  return SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.symmetric(vertical: 12, horizontal: 16),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              const Text('Select Stream Server', style: TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold)),
                              IconButton(icon: const Icon(Icons.close, color: Colors.white54, size: 20), onPressed: () => Navigator.pop(ctx)),
                            ],
                          ),
                          const SizedBox(height: 8),
                          ...List.generate(_servers.length, (idx) {
                            final isSel = idx == _currentServer;
                            return Container(
                              margin: const EdgeInsets.symmetric(vertical: 4),
                              decoration: BoxDecoration(
                                color: isSel ? Colors.redAccent.withOpacity(0.15) : Colors.white.withOpacity(0.04),
                                borderRadius: BorderRadius.circular(10),
                                border: Border.all(color: isSel ? Colors.redAccent : Colors.transparent),
                              ),
                              child: ListTile(
                                dense: true,
                                leading: Icon(Icons.dns_rounded, color: isSel ? Colors.redAccent : Colors.white70, size: 20),
                                title: Text(_servers[idx]['name']!, style: TextStyle(color: isSel ? Colors.redAccent : Colors.white, fontSize: 14, fontWeight: isSel ? FontWeight.bold : FontWeight.normal)),
                                trailing: isSel ? const Icon(Icons.check_circle, color: Colors.redAccent, size: 18) : null,
                                onTap: () {
                                  Navigator.pop(ctx);
                                  setState(() {
                                    _currentServer = idx;
                                    _isLoading = true;
                                  });
                                  _controller.loadRequest(Uri.parse(_servers[idx]['url']!));
                                  _startHideTimer();
                                },
                              ),
                            );
                          }),
                          const SizedBox(height: 12),
                        ],
                      ),
                    ),
                  );
                },
              ).then((_) => _startHideTimer());
            }

            @override
            void dispose() {
              _hideTimer?.cancel();
              SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
              WakelockPlus.disable();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _controller),

                      Positioned.fill(
                        child: GestureDetector(
                          behavior: HitTestBehavior.translucent,
                          onTap: _toggleControls,
                        ),
                      ),

                      if (_isLoading)
                        Container(
                          color: Colors.black,
                          child: Center(
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const CircularProgressIndicator(color: Colors.redAccent),
                                const SizedBox(height: 16),
                                Text('Connecting to ${_servers[_currentServer]['name']}...', style: const TextStyle(color: Colors.white70, fontSize: 13)),
                              ],
                            ),
                          ),
                        ),

                      AnimatedOpacity(
                        duration: const Duration(milliseconds: 300),
                        opacity: _showControls ? 1.0 : 0.0,
                        child: IgnorePointer(
                          ignoring: !_showControls,
                          child: Container(
                            padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                            decoration: BoxDecoration(
                              gradient: LinearGradient(
                                colors: [Colors.black.withOpacity(0.85), Colors.transparent],
                                begin: Alignment.topCenter,
                                end: Alignment.bottomCenter,
                              ),
                            ),
                            child: Row(
                              children: [
                                InkWell(
                                  borderRadius: BorderRadius.circular(20),
                                  onTap: () => Navigator.pop(context),
                                  child: Container(
                                    padding: const EdgeInsets.all(8),
                                    decoration: BoxDecoration(
                                      color: Colors.black.withOpacity(0.4),
                                      shape: BoxShape.circle,
                                    ),
                                    child: const Icon(Icons.arrow_back_ios_new, color: Colors.white, size: 18),
                                  ),
                                ),
                                const SizedBox(width: 14),
                                Expanded(
                                  child: Text(
                                    _resolvedTitle,
                                    maxLines: 1,
                                    overflow: TextOverflow.ellipsis,
                                    style: const TextStyle(color: Colors.white, fontSize: 15, fontWeight: FontWeight.w600),
                                  ),
                                ),
                                InkWell(
                                  borderRadius: BorderRadius.circular(20),
                                  onTap: _showServerSheet,
                                  child: Container(
                                    padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                                    decoration: BoxDecoration(
                                      color: Colors.black.withOpacity(0.55),
                                      borderRadius: BorderRadius.circular(20),
                                      border: Border.all(color: Colors.white24, width: 0.8),
                                    ),
                                    child: Row(
                                      mainAxisSize: MainAxisSize.min,
                                      children: [
                                        const Icon(Icons.tune_rounded, color: Colors.redAccent, size: 14),
                                        const SizedBox(width: 6),
                                        Text('Server ${_currentServer + 1}', style: const TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.bold)),
                                        const SizedBox(width: 4),
                                        const Icon(Icons.keyboard_arrow_down, color: Colors.white70, size: 14),
                                      ],
                                    ),
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF
          cp lib/screens/player/player_screen.dart lib/screens/player_screen.dart 2>/dev/null || true

      - name: Patch Android SDK 35, Proguard & Java Baklava Fix
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. Force compileSdk 35 inside android project
          for root, _, files in os.walk('android'):
              for f in files:
                  if f.startswith('build.gradle'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fl:
                          c = fl.read()
                      c = re.sub(r'compileSdk(Version)?\s*=?\s*(flutter\.)?compileSdkVersion', 'compileSdk = 35', c)
                      c = re.sub(r'compileSdkVersion\s+[0-9]+', 'compileSdkVersion 35', c)
                      c = re.sub(r'compileSdk\s*=\s*[0-9]+', 'compileSdk = 35', c)
                      c = c.replace('proguard-android.txt', 'proguard-android-optimize.txt')
                      with open(p, 'w', encoding='utf-8') as fl:
                          fl.write(c)

          # 2. Force compileSdk 35 in pub-cache plugins
          cache_dir = os.path.expanduser('~/.pub-cache')
          for root, _, files in os.walk(cache_dir):
              for f in files:
                  if f.endswith('.gradle'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fl:
                          c = fl.read()
                      c = re.sub(r'compileSdkVersion\s+[0-9]+', 'compileSdkVersion 35', c)
                      c = re.sub(r'compileSdk\s*=\s*[0-9]+', 'compileSdk = 35', c)
                      c = c.replace('proguard-android.txt', 'proguard-android-optimize.txt')
                      with open(p, 'w', encoding='utf-8') as fl:
                          fl.write(c)

          # 3. Auto-patch Java Baklava symbols
          for root, _, files in os.walk(cache_dir):
              for f in files:
                  if f.endswith('.java'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fl:
                          c = fl.read()
                      if 'BAKLAVA' in c or 'Locale.of' in c or 'thread.threadId()' in c:
                          c = c.replace('Build.VERSION_CODES.BAKLAVA', '999')
                          c = c.replace('Locale.of(language, country, variant)', 'new Locale(language, country, variant)')
                          c = c.replace('thread.threadId()', 'thread.getId()')
                          with open(p, 'w', encoding='utf-8') as fl:
                              fl.write(c)
                          print(f"Successfully auto-patched Java file: {p}")
          EOF

          cat << 'EOF' >> android/build.gradle

          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          try { compileSdkVersion 35 } catch (e) {}
                          try { compileSdk = 35 } catch (e) {}
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jmovies-apk
          path: build/app/outputs/flutter-apk/*.apk
